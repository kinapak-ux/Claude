<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel Gaffer '96</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b1650">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Gaffer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--bg:#0b1650;--panel:#1a2a86;--edge:#4d63d6;--lite:#3c51c2;--dark:#070d36;--tx:#eef1ff;--dim:#9aa6dd;--yel:#ffd23f;--grn:#3ddc5a;--red:#ff4b55;--cy:#5fe3ff;--org:#ff8a1f;--mag:#ff7ae0;--px:'Press Start 2P',monospace;--vt:'VT323',monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--vt);font-size:21px;line-height:1.12;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% -20%,#2238a8,transparent 60%);background-attachment:fixed}
#app{max-width:600px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top)) 10px calc(96px + env(safe-area-inset-bottom))}
img.badge,img.face,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
img.badge{vertical-align:middle;flex:none}
a{color:var(--cy)}
b{font-weight:normal;color:#fff}
small{font-size:.8em}
h2,h3{margin:0}
.px{font-family:var(--px);font-size:12px;letter-spacing:1px}
.center{text-align:center}
.note{color:var(--dim);font-size:18px;margin:6px 0}
.c-y{color:var(--yel)}.c-g{color:var(--grn)}.c-r{color:var(--red)}.c-c{color:var(--cy)}.c-o{color:var(--org)}.c-m{color:var(--mag)}.c-d{color:var(--dim)}
.big{font-family:var(--px);font-size:22px;margin:6px 0}

/* chunky Amiga-ish panels and buttons */
.panel{background:var(--panel);border:2px solid #000;box-shadow:inset 2px 2px 0 var(--lite),inset -2px -2px 0 var(--dark),0 4px 0 rgba(0,0,0,.35);padding:10px 12px;margin:12px 0}
.panel h2{font-family:var(--px);font-size:10px;color:var(--yel);margin:0 0 8px;text-transform:uppercase;line-height:1.5}
.panel.alert{background:#6a1a2a;cursor:pointer}
.panel p{margin:6px 0}
.btn{font-family:var(--px);font-size:10px;line-height:1.3;padding:11px 12px;background:#d6d8ea;color:#111;border:0;border-radius:0;cursor:pointer;text-transform:uppercase;
  box-shadow:inset -3px -3px 0 #8587a3,inset 3px 3px 0 #fff,0 0 0 2px #000;margin:4px;touch-action:manipulation}
.btn:active{box-shadow:inset 3px 3px 0 #8587a3,inset -3px -3px 0 #fff,0 0 0 2px #000;transform:translateY(1px)}
.btn:disabled{opacity:.5}
.btn.go{background:var(--grn);box-shadow:inset -3px -3px 0 #1f8a33,inset 3px 3px 0 #a6ffb5,0 0 0 2px #000}
.btn.bad{background:#ff7a82;box-shadow:inset -3px -3px 0 #b02a34,inset 3px 3px 0 #ffc7cb,0 0 0 2px #000}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:0 0 0 2px var(--edge)}
.btn.small{font-size:8px;padding:9px 10px}
.btn.big{font-size:12px;padding:15px 16px}
.btn.wide{display:block;width:calc(100% - 8px)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
.answers{display:flex;flex-direction:column}
.answers .btn{text-align:left;text-transform:none;font-family:var(--vt);font-size:20px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-family:var(--px);font-size:8px;padding:8px 9px;background:var(--dark);color:var(--tx);border:2px solid var(--edge);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--yel);color:#000;border-color:#000}
.chips.small .chip{font-size:7px;padding:6px 7px}
.tog{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:19px}
.tog input{width:22px;height:22px;accent-color:var(--grn);flex:none}
.txt{width:100%;font-family:var(--vt);font-size:26px;padding:8px 10px;background:#000;color:var(--yel);border:2px solid var(--edge);border-radius:0;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .panel{margin:0}
.stat small{color:var(--dim)}
.row{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.12);cursor:pointer}
.sticky{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;padding-top:6px}
.sticky.two{display:grid;grid-template-columns:2fr 1fr}
.top-simple{display:flex;align-items:center;gap:10px;margin:8px 0}
.top-simple h2{color:var(--yel)}
.divh{font-family:var(--px);font-size:9px;color:var(--cy);margin:14px 0 6px;line-height:1.6}
.divh small{display:block;font-family:var(--vt);font-size:17px;color:var(--dim);letter-spacing:0}

/* bars, tags, tables */
.bar{display:inline-block;width:46px;height:8px;background:#000;border:1px solid #000;vertical-align:middle;position:relative}
.bar i{display:block;height:100%;background:var(--grn)}
.bar.y i,.bar .y{background:var(--yel)}.bar.r i{background:var(--red)}.bar.c i{background:var(--cy)}.bar.g i{background:var(--grn)}
.stat .bar{width:100%;height:12px;margin:6px 0}
.pos{display:inline-block;font-family:var(--px);font-size:7px;padding:3px 3px 2px;color:#000;min-width:22px;text-align:center}
.p-GK{background:var(--yel)}.p-DF{background:var(--cy)}.p-MF{background:var(--grn)}.p-FW{background:#ff7a82}
.tag{font-family:var(--px);font-size:6px;padding:2px 3px;margin-left:3px;vertical-align:middle;color:#000}
.tag.r{background:var(--red)}.tag.o{background:var(--org)}.tag.c{background:var(--cy)}.tag.y{background:var(--yel)}.tag.g{background:var(--grn)}
.fm{display:inline-block;width:16px;text-align:center;font-family:var(--px);font-size:7px;padding:2px 0;margin-right:1px;color:#000}
.fm.W{background:var(--grn)}.fm.D{background:var(--yel)}.fm.L{background:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:20px}
.tbl th{font-family:var(--px);font-size:7px;color:var(--yel);text-align:left;padding:4px 3px;border-bottom:2px solid var(--edge)}
.tbl td{padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
.tbl td.nm{white-space:normal;width:99%}
.tbl tr[data-a]{cursor:pointer}
.tbl tr:nth-child(even){background:rgba(0,0,0,.14)}
.tbl tr.me{background:rgba(255,210,63,.22)!important}
.tbl tr.up td:first-child{box-shadow:inset 4px 0 0 var(--grn)}
.tbl tr.down td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.tbl tr.dim{opacity:.45}
.tbl tr.xi td:first-child{box-shadow:inset 4px 0 0 var(--yel)}
.tbl th.srt{cursor:pointer}.tbl.squad td+td+td,.tbl.squad th+th+th{padding-left:7px}.tbl th.srt.on{color:var(--cy)}
.sqsum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
.sqsum div{background:var(--dark);border:2px solid var(--edge);padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.sqsum>div>span{font-family:var(--px);font-size:7px;color:var(--dim);text-transform:uppercase}
.sqsum b{font-family:var(--px);font-size:13px;margin:5px 0 3px;color:var(--tx)}
.sqsum i{font-style:normal;font-size:15px;line-height:1;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqviews{display:flex;gap:6px;margin:4px 0}.sqviews .chip{flex:1;justify-content:center}.sqviews .chip.on{background:var(--yel);color:#000;border-color:#000}
.xi-key{display:inline-block;width:6px;height:14px;background:var(--yel);vertical-align:middle}
.league td:nth-child(n+4){text-align:right}

/* header and nav */
.hdr{display:flex;align-items:center;gap:8px;background:#000;border:2px solid var(--edge);padding:6px 6px 6px 8px;position:sticky;top:calc(4px + env(safe-area-inset-top));z-index:10;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.hclub{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hclub div{min-width:0}
.hclub b{display:block;font-family:var(--px);font-size:9px;color:var(--yel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.hclub small{color:var(--dim);font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcash{font-family:var(--px);font-size:9px}
.hdr .btn{margin:0 2px 0 4px;padding:10px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(7,1fr);background:#000;border-top:2px solid var(--edge);padding:4px 4px calc(4px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.nav button{background:none;border:0;color:var(--dim);font-family:var(--px);font-size:6px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer}
.nav button i{font-style:normal;font-family:var(--vt);font-size:24px;line-height:.8}
.nav button.on{color:var(--yel);background:var(--panel)}
.nav .dot{position:absolute;top:2px;right:8px;background:var(--red);color:#fff;font-size:7px;padding:2px 3px}

/* teletext */
.ttx{background:#000;padding:8px 10px;margin:12px 0;font-size:21px;border:2px solid #222;text-transform:uppercase}
.ttxh{display:flex;justify-content:space-between;background:#1d3fbf;color:var(--yel);padding:2px 6px;margin:-2px -4px 8px;font-size:22px}
.ttxh span:nth-child(2){color:#fff;background:#d8242c;padding:0 6px}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;color:#fff;align-items:baseline}
.res span:first-child{text-align:right}
.res b{color:var(--yel);min-width:34px;text-align:center}
.res small{grid-column:1/-1;text-align:center;color:var(--cy);margin-top:-4px}
.res.mine{background:#1d3fbf}
.vidi .c-y{margin-top:8px}
.inbox .msg{border-bottom:1px solid #333;padding:6px 0;cursor:pointer}
.inbox .msg.unread .c-y::before{content:'► ';color:var(--red)}
.inbox .mh{display:flex;justify-content:space-between;font-size:18px}
.inbox .mb{color:#fff;text-transform:none;margin:6px 0;font-size:20px}

/* home */
.nextfx{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:center;margin-bottom:8px}
.vs{flex:1;display:flex;flex-direction:column;gap:3px}
.vs b{font-family:var(--px);font-size:11px;color:var(--yel);line-height:1.5}
.vs > span{font-size:24px}
.vs .fm{font-size:7px;width:16px;padding:2px 0;vertical-align:middle}
.vs small{color:var(--dim)}

/* tactics pitch (portrait) */
.tpitch2{position:relative;width:100%;aspect-ratio:3/3.6;margin:10px 0;background:repeating-linear-gradient(0deg,#2a8c34 0 12.5%,#2f9a3a 12.5% 25%);border:3px solid #fff;outline:2px solid #000}
.tpitch2::before{content:'';position:absolute;left:25%;right:25%;bottom:0;height:16%;border:2px solid rgba(255,255,255,.7);border-bottom:0}
.tpitch2::after{content:'';position:absolute;left:0;right:0;top:0;border-top:2px solid rgba(255,255,255,.7);height:0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;color:#fff;font-family:var(--vt);font-size:17px;cursor:pointer;padding:0;width:70px}
.slot i{width:20px;height:18px;border:3px solid;border-top-width:4px;box-shadow:0 0 0 2px #000}
.slot span{background:rgba(0,0,0,.65);padding:0 4px;margin-top:3px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b{font-family:var(--px);font-size:7px;background:#000;padding:2px 3px}
.slot.off span{color:var(--red)}
.slot.sel i{outline:3px solid var(--yel)}
.bench{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lineup{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:19px}

/* player card */
.pcard h3{font-family:var(--px);font-size:11px;color:var(--yel);line-height:1.5}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.phead > div{flex:1}
img.face{border:3px solid #000;background:#5fb8ff;box-shadow:0 0 0 2px var(--edge)}
.pbig{font-family:var(--px);font-size:22px}
.attrs div{display:grid;grid-template-columns:100px 1fr 34px;align-items:center;gap:8px;margin:3px 0}
.attrs .bar{width:100%;height:12px}
.attrs b{font-family:var(--px);font-size:10px;text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0}
.kv span{color:var(--dim)}
.trait{background:#2a1450;padding:6px 8px;margin:8px 0;border-left:4px solid var(--mag)}

/* negotiation */
.chair{display:flex;align-items:center;gap:10px;background:#000;padding:8px;margin:8px 0}
.chair > div{flex:1}
.say{color:var(--cy);font-size:20px}
.face{font-size:34px}
.offer{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.offer b{font-family:var(--px);font-size:16px;min-width:120px;text-align:center}
.offer.small b{font-size:12px;min-width:50px}
.offer.small span{margin-right:auto}
.neg h3,.modal h3{font-family:var(--px);font-size:11px;color:var(--yel);line-height:1.6;margin-bottom:8px}

/* modals and toasts */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,20,.7);display:flex;align-items:flex-end;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.mbox{background:var(--panel);border:2px solid #000;box-shadow:inset 2px 2px 0 var(--lite),inset -2px -2px 0 var(--dark),0 0 0 2px var(--edge);padding:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.howto p{margin:8px 0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:#000;color:#fff;border:2px solid var(--yel);padding:8px 12px;font-size:20px;max-width:92vw;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:translateX(-50%) scale(.8)}}

/* title */
.title{text-align:center;padding-top:10px}
.tpitch{width:100%;border:3px solid #000;box-shadow:0 0 0 2px var(--edge);display:block}
.logo{font-family:var(--px);margin:18px 0 6px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo span{font-size:clamp(26px,9vw,44px);color:var(--yel);text-shadow:4px 4px 0 #d8242c,8px 8px 0 #000}
.logo span+span{color:#fff;text-shadow:4px 4px 0 #1d3fbf,8px 8px 0 #000}
.logo small{font-size:16px;color:var(--cy);margin-top:6px}
.tag-line{color:var(--dim)}
.menu{display:flex;flex-direction:column;max-width:340px;margin:14px auto}
.foot{color:var(--dim);font-size:18px}
.clubgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.clubpick{display:flex;align-items:center;gap:8px;background:var(--dark);border:2px solid var(--edge);color:var(--tx);font-family:var(--vt);font-size:19px;padding:6px 8px;text-align:left;cursor:pointer}
.clubpick.on{background:var(--yel);color:#000;border-color:#000}
.clubpick.wide{width:100%;margin:4px 0}
.arc p{margin:4px 0}

.pips{display:inline-flex;gap:3px;vertical-align:middle}.pips i{width:12px;height:12px;background:#000;border:2px solid var(--yel)}.pips i.on{background:var(--yel)}
.tacbar{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0 0}
.tacbar .btn{margin:2px;display:flex;align-items:center;justify-content:center;gap:6px}
.oppsel{font-family:var(--vt);font-size:19px;background:#000;color:var(--yel);border:2px solid var(--edge);padding:4px 6px;max-width:100%}
.opp .nextfx{justify-content:flex-start;text-align:left}
.opp .vs{align-items:flex-start}
div.slot{cursor:pointer}
.scenh{display:flex;justify-content:space-between;align-items:center;background:#000;margin:-14px -14px 10px;padding:8px 12px;border-bottom:2px solid var(--edge);font-family:var(--px);font-size:9px;color:var(--cy);line-height:1.5}
.scenh small{font-family:var(--vt);font-size:17px;color:var(--dim)}
.scenq{display:flex;gap:12px;align-items:center}
.scenq p{font-size:23px;margin:6px 0;flex:1}
.scenq img.face{flex:none}
.scenr{font-size:23px;margin:8px 0 12px}
.effs{display:flex;flex-wrap:wrap;gap:6px}
.eff{font-family:var(--px);font-size:8px;padding:6px 8px;background:var(--dark);border:2px solid var(--edge);line-height:1.4}
.eff.up{color:var(--grn);border-color:var(--grn)}.eff.down{color:var(--red);border-color:var(--red)}
.mback{font-family:var(--px);font-size:8px;background:transparent;color:var(--tx);border:2px solid var(--edge);padding:7px 9px;cursor:pointer;margin-right:4px}
.mback:active{background:var(--panel)}
.mhead .mt{flex:1}
.menu2{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.nav{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:7px;gap:6px;padding:7px 0 6px}
.nav button img{width:26px;height:24px;image-rendering:pixelated}
.nav .dot{right:16%}
.hdr .nextbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px}
.hdr .nextbtn small{font-size:7px;opacity:.8}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 0}
.subtabs button{font-family:var(--px);font-size:8px;padding:10px 4px;background:var(--dark);color:var(--dim);border:2px solid var(--edge);cursor:pointer}
.subtabs button.on{background:var(--yel);color:#000;border-color:#000}
.tag.m{background:var(--mag)}
.rng{font-size:.9em;letter-spacing:-.5px}
.scoutbox{background:#000;border:2px dashed var(--edge);padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cmpt td:nth-child(n+2),.cmpt th:nth-child(n+2){text-align:center}
.cal{background:#000;border:2px solid #222;padding:4px 6px}
.calm{font-family:var(--px);font-size:8px;color:var(--yel);padding:10px 0 4px;border-bottom:1px solid #333}
.calr{display:grid;grid-template-columns:26px 44px 16px 1fr auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #161a30;font-size:19px;cursor:pointer}
.calr.dim{grid-template-columns:26px 44px 1fr;opacity:.45;cursor:default}
.calr.now{background:#1d3fbf}
.calr.past{opacity:.75}
.calr .d{color:var(--dim);text-align:right}
.calr .o{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.comp{font-family:var(--px);font-size:6px;padding:3px 2px;text-align:center;color:#000}
.comp.l{background:var(--cy)}.comp.c{background:var(--yel)}
.diff{font-family:var(--px);font-size:6px;padding:3px 4px;color:#000}
.diff.h{background:var(--red)}.diff.m{background:var(--yel)}.diff.e{background:var(--grn)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.achb{background:var(--dark);border:2px solid #2a3570;padding:6px 8px;opacity:.55;display:grid;grid-template-columns:30px 1fr;column-gap:6px;align-items:center}
.achb.on{opacity:1;border-color:var(--yel)}
.achb .ai{grid-row:span 2;font-size:24px;text-align:center}
.achb b{font-size:18px;color:var(--yel)}
.achb small{color:var(--dim);font-size:15px;line-height:1}
.achtoast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:95;background:#000;border:3px solid var(--yel);box-shadow:0 0 0 2px #000,0 6px 0 rgba(0,0,0,.5);padding:8px 14px;display:flex;gap:10px;align-items:center;min-width:260px;animation:achin .35s}
.achtoast .ai{font-size:30px}
.achtoast small{display:block;font-family:var(--px);font-size:7px;color:var(--cy)}
.achtoast b{display:block;font-family:var(--px);font-size:10px;color:var(--yel);margin:4px 0}
.achtoast span:last-child{color:#fff;font-size:18px}
@keyframes achin{from{transform:translate(-50%,-120%)}}
.slotrow{display:flex;align-items:center;gap:10px;background:var(--dark);border:2px solid var(--edge);padding:8px;margin:6px 0}
.slotrow .sl{flex:1;min-width:0}
.slotrow .sl b{display:block;color:var(--yel)}
.slotrow .sl small{color:var(--dim)}
