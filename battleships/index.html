<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battleships</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#06213a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Battleships">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="../kit.css">
<style>
:root{--bg:#04172b;--bg2:#0d4a7a;--accent:#ffb020;--accent-ink:#2a1700;--display:"Black Ops One",Impact,system-ui,sans-serif;--sea:#0b4f86;--sea2:#0a3d6b;--ship:#9fb3c8}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:4px;border-radius:12px;background:#06243f;border:2px solid rgba(255,255,255,.18);width:min(100%,420px);margin:0 auto;touch-action:manipulation}
.board.small{width:min(66%,280px)}
.board.target .cell.open{cursor:crosshair}
.board.target.myturn{border-color:var(--accent);box-shadow:0 0 18px rgba(255,176,32,.45)}
.cell{position:relative;aspect-ratio:1;border-radius:3px;background:linear-gradient(160deg,var(--sea),var(--sea2));display:grid;place-items:center;font-size:clamp(10px,3.6vw,18px);line-height:1;border:0;padding:0}
.board.small .cell{font-size:clamp(8px,2.4vw,12px)}
.cell.ship{background:linear-gradient(180deg,#c9d6e3,#7d93a8);border-radius:2px}
.cell.ship.h0{border-radius:50% 2px 2px 50%/50% 2px 2px 50%}.cell.ship.h1{border-radius:2px 50% 50% 2px/2px 50% 50% 2px}
.cell.ship.v0{border-radius:50% 50% 2px 2px/50% 50% 2px 2px}.cell.ship.v1{border-radius:2px 2px 50% 50%/2px 2px 50% 50%}
.cell.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(255,255,255,.55)}
.cell.hit{background:radial-gradient(circle,#ffcc4d,#e04b1a 60%,#7a1d0a)}
.cell.hit::after{content:"💥"}
.cell.sunk{background:linear-gradient(180deg,#5a2a20,#2a0f0a)}
.cell.sunk::after{content:"🔥"}
.cell.last{outline:3px solid #fff;outline-offset:-1px;animation:flash .8s ease-out 2}
@keyframes flash{50%{transform:scale(1.25)}}
.board.place .cell.ship{cursor:pointer}
.banner{text-align:center;font-family:var(--display);font-size:22px;margin:4px 0 10px;letter-spacing:1px}
.banner.go{color:var(--accent);animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.fleet{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.fleet span{font-size:12px;font-weight:900;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.1)}
.fleet span.gone{text-decoration:line-through;opacity:.45}
.sec{font-family:var(--display);font-size:16px;letter-spacing:1px;text-align:center;margin:12px 0 6px;color:var(--mut)}
.boom{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(40px,14vw,80px);pointer-events:none;z-index:30;text-shadow:0 4px 0 rgba(0,0,0,.5);animation:boom 1.1s ease-out forwards;white-space:nowrap}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="toast"></div>
<script src="../scores.js"></script>
<script src="../party.js"></script>
<script>
'use strict';
const N = 10, PREFIX = 'battleships-v1-', CPU = 'cpu';
const FLEET = [['Carrier', 5], ['Battleship', 4], ['Cruiser', 3], ['Submarine', 3], ['Destroyer', 2]];
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000); }
function openModal(h) { const m = $('#modal'); m.innerHTML = h; m.classList.add('on'); }
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
function boom(text, color) { const d = document.createElement('div'); d.className = 'boom'; d.textContent = text; d.style.color = color; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
function confetti(n) { const bits = ['🎉', '⭐', '⚓', '🏆', '🎊']; for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'conf'; d.textContent = bits[i % bits.length]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (2 + Math.random() * 2.5) + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 6000); } }
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const SFX = {
  ctx: null,
  init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  noise(d, f, v) { if (!this.ctx) return; const c = this.ctx, b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / a.length, 2); const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); fl.type = 'lowpass'; fl.frequency.value = f; g.gain.value = v; s.buffer = b; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(); },
  tone(f, t, d, v) { if (!this.ctx) return; const c = this.ctx, o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v || .15, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .05); },
  hit() { this.noise(.7, 900, .9); },
  miss() { this.noise(.45, 2600, .35); },
  sunk() { this.noise(1.2, 500, 1); [392, 330, 262].forEach((f, i) => this.tone(f, .2 + i * .15, .3)); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, i * .14, .3)); },
};

/* ================= rules ================= */
const rc = i => [Math.floor(i / N), i % N];
function shipCells(start, len, vert) { const [r, c] = rc(start), out = []; for (let k = 0; k < len; k++) { const rr = r + (vert ? k : 0), cc = c + (vert ? 0 : k); if (rr >= N || cc >= N) return null; out.push(rr * N + cc); } return out; }
function fits(cells, fleet, skip) { if (!cells) return false; const used = new Set(); fleet.forEach((s, k) => { if (k !== skip) s.cells.forEach(x => used.add(x)); }); return cells.every(x => !used.has(x)); }
function randomFleet() {
  for (;;) {
    const fleet = [];
    let ok = true;
    for (const [n, len] of FLEET) {
      let placed = false;
      for (let tries = 0; tries < 200 && !placed; tries++) {
        const vert = Math.random() < .5, cells = shipCells(Math.floor(Math.random() * N * N), len, vert);
        if (fits(cells, fleet)) { fleet.push({n, len, vert, cells}); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return fleet;
  }
}
// Turning a ship pivots it on its first square; if that doesn't fit, try nearby spots.
function rotate(fleet, k) {
  const s = fleet[k], vert = !s.vert;
  for (const start of [s.cells[0], ...s.cells.slice(1)]) {
    for (let back = 0; back < s.len; back++) {
      const [r, c] = rc(start), st = vert ? (r - back) * N + c : r * N + (c - back);
      if ((vert ? r - back : c - back) < 0) continue;
      const cells = shipCells(st, s.len, vert);
      if (fits(cells, fleet, k)) { fleet[k] = {n: s.n, len: s.len, vert, cells}; return true; }
    }
  }
  return false;
}
const sunkShips = (fleet, shots) => fleet.filter(s => s.cells.every(x => shots[x]));

/* ================= game (host or solo against the computer) ================= */
let G = null, ROOM = null, C = null;
const UI = {screen: 'home', v: null, lastShot: null, offline: false, reported: null};
function newGame(players, solo) {
  G = {phase: 'lobby', solo, players, fleets: {}, ready: {}, shots: {}, turn: null, last: null, winner: null, bonus: true, gid: ''};
  players.forEach(p => { G.fleets[p.pid] = randomFleet(); G.shots[p.pid] = {}; G.ready[p.pid] = false; });
}
const other = pid => G.players.find(p => p.pid !== pid);
function startPlacing() {
  G.phase = 'place'; G.winner = null; G.last = null; G.gid = Math.random().toString(36).slice(2, 8);
  G.players.forEach(p => { G.fleets[p.pid] = randomFleet(); G.shots[p.pid] = {}; G.ready[p.pid] = p.pid === CPU; });
}
function act(pid, m) {
  const isHost = pid === Party.pid;
  if (!G) return;
  switch (m.t) {
    case 'start': if (isHost && G.phase === 'lobby' && G.players.length === 2) { startPlacing(); push(); } break;
    case 'bonus': if (isHost && G.phase === 'lobby') { G.bonus = !!m.on; push(); } break;
    case 'shuffle': if (G.phase === 'place' && !G.ready[pid]) { G.fleets[pid] = randomFleet(); push(); } break;
    case 'rotate': if (G.phase === 'place' && !G.ready[pid] && G.fleets[pid][m.k]) { if (rotate(G.fleets[pid], m.k)) push(); else if (pid === Party.pid) toast('No room to turn that ship there.'); else if (ROOM) ROOM.send(pid, {t: 'toast', msg: 'No room to turn that ship there.'}); } break;
    case 'ready':
      if (G.phase !== 'place') return;
      G.ready[pid] = true;
      if (G.players.every(p => G.ready[p.pid])) { G.phase = 'battle'; G.turn = G.players[Math.floor(Math.random() * 2)].pid; }
      push(); break;
    case 'fire': fire(pid, m.i); break;
    case 'rematch': if (isHost && G.phase === 'over') { startPlacing(); push(); } break;
  }
}
function fire(pid, i) {
  if (G.phase !== 'battle' || G.turn !== pid || !(i >= 0 && i < N * N) || G.shots[pid][i]) return;
  const foe = other(pid), fleet = G.fleets[foe.pid], ship = fleet.find(s => s.cells.includes(i));
  G.shots[pid][i] = ship ? 'hit' : 'miss';
  const sunk = ship && ship.cells.every(x => G.shots[pid][x]) ? ship.n : null;
  G.last = {by: pid, i, hit: !!ship, sunk, n: (G.last ? G.last.n : 0) + 1};
  if (sunkShips(fleet, G.shots[pid]).length === fleet.length) { G.phase = 'over'; G.winner = pid; }
  else if (!(ship && G.bonus)) G.turn = foe.pid;
  push();
}
// The computer searches on a checkerboard, then follows up hits until the ship sinks.
function cpuTurn() {
  const shots = G.shots[CPU], fleet = G.fleets[G.players[0].pid];
  const sunkCells = new Set(sunkShips(fleet, shots).flatMap(s => s.cells));
  const hits = Object.keys(shots).map(Number).filter(i => shots[i] === 'hit' && !sunkCells.has(i));
  const open = i => i >= 0 && i < N * N && !shots[i];
  const nbrs = i => { const [r, c] = rc(i); return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([a, b]) => a >= 0 && a < N && b >= 0 && b < N).map(([a, b]) => a * N + b); };
  let options = [];
  if (hits.length >= 2) {
    const rows = new Set(hits.map(i => rc(i)[0])), cols = new Set(hits.map(i => rc(i)[1]));
    if (rows.size === 1 || cols.size === 1) {
      const sorted = hits.slice().sort((a, b) => a - b), step = rows.size === 1 ? 1 : N;
      const lo = sorted[0] - step, hi = sorted[sorted.length - 1] + step;
      options = [lo, hi].filter(x => open(x) && (step === N || rc(x)[0] === rc(sorted[0])[0]));
    }
  }
  if (!options.length && hits.length) options = [...new Set(hits.flatMap(nbrs))].filter(open);
  if (!options.length) options = [...Array(N * N).keys()].filter(i => open(i) && (rc(i)[0] + rc(i)[1]) % 2 === 0);
  if (!options.length) options = [...Array(N * N).keys()].filter(open);
  fire(CPU, options[Math.floor(Math.random() * options.length)]);
}
function viewFor(pid) {
  const foe = other(pid);
  const fleetOf = id => G.fleets[id].map(s => ({n: s.n, len: s.len, vert: s.vert, cells: s.cells}));
  return {
    phase: G.phase, code: ROOM ? ROOM.code : null, host: Party.pid, solo: G.solo, bonus: G.bonus, gid: G.gid, turn: G.turn, last: G.last, winner: G.winner,
    players: G.players.map(p => ({pid: p.pid, name: p.name, ready: G.ready[p.pid], on: p.pid === CPU || p.pid === Party.pid || !!(ROOM && ROOM.isOn(p.pid))})),
    me: {fleet: fleetOf(pid), shotsAtMe: foe ? G.shots[foe.pid] : {}},
    foe: foe ? {pid: foe.pid, name: foe.name, myShots: G.shots[pid], sunk: sunkShips(G.fleets[foe.pid], G.shots[pid]).map(s => ({n: s.n, cells: s.cells})),
      fleet: G.phase === 'over' ? fleetOf(foe.pid) : null} : null,
  };
}
function push() {
  if (!G) return;
  if (ROOM) G.players.forEach(p => { if (p.pid !== Party.pid && p.pid !== CPU) ROOM.send(p.pid, {t: 'state', v: viewFor(p.pid)}); });
  UI.v = viewFor(Party.pid); render();
  if (G.solo && G.phase === 'battle' && G.turn === CPU) setTimeout(() => { if (G && G.phase === 'battle' && G.turn === CPU) cpuTurn(); }, 950);
}
function playComputer() {
  newGame([{pid: Party.pid, name: Party.name() || 'You'}, {pid: CPU, name: 'Admiral Bot'}], true);
  UI.screen = 'game'; startPlacing(); push();
}
function hostGame() {
  newGame([{pid: Party.pid, name: Party.name() || 'Captain'}], false);
  UI.screen = 'game'; push();
  Party.host(PREFIX, {
    onOpen: () => push(),
    onJoin: (pid, hello) => {
      const p = G.players.find(x => x.pid === pid);
      if (p) { p.name = String(hello.name || p.name).slice(0, 16); return true; }
      if (G.players.length >= 2) return 'This battle already has two captains.';
      G.players.push({pid, name: String(hello.name || 'Captain').slice(0, 16)});
      G.fleets[pid] = randomFleet(); G.shots[pid] = {}; G.ready[pid] = false;
      return true;
    },
    onConnect: () => push(), onLeave: () => push(), onMessage: (pid, m) => act(pid, m), onError: t => toast(t),
  }).then(r => { ROOM = r; push(); }).catch(() => { toast('Could not load the connection helper. Check your internet.'); goHome(); });
}
function joinGame(code) {
  code = Party.cleanCode(code);
  if (code.length !== 4) return toast('The battle code has 4 letters.');
  closeModal(); UI.screen = 'connecting'; render();
  Party.join(PREFIX, code, {
    onMessage: d => { if (d.t === 'state') { UI.v = d.v; UI.screen = 'game'; render(); } else if (d.t === 'toast') toast(d.msg); },
    onStatus: s => { UI.offline = s === 'lost'; const nb = $('#netbar'); if (nb) nb.innerHTML = netbar(); },
    onFail: t => { toast(t); goHome(); },
  }).then(c => { C = c; }).catch(() => { toast('Could not load the connection helper. Check your internet.'); goHome(); });
}
function send(m) { if (G) act(Party.pid, m); else if (C && !C.send(m)) toast('Not connected right now. Reconnecting…'); }
function goHome() { if (ROOM) ROOM.close(); if (C) C.close(); G = null; ROOM = null; C = null; UI.screen = 'home'; UI.v = null; UI.offline = false; render(); }
const netbar = () => UI.offline ? `<div class="netbar">📡 Lost contact with the other ship. Reconnecting…</div>` : '';

/* ================= screens ================= */
function grid(kind, fleet, shots, sunkList, opts) {
  opts = opts || {};
  const shipAt = {}, sunkAt = new Set((sunkList || []).flatMap(s => s.cells));
  (fleet || []).forEach((s, k) => s.cells.forEach((x, j) => { shipAt[x] = {k, end: j === 0 ? 0 : j === s.len - 1 ? 1 : -1, vert: s.vert}; }));
  let h = '';
  for (let i = 0; i < N * N; i++) {
    const sh = shipAt[i], shot = shots && shots[i], cls = ['cell'];
    if (sh) { cls.push('ship'); if (sh.end >= 0) cls.push((sh.vert ? 'v' : 'h') + sh.end); }
    if (sunkAt.has(i)) cls.push('sunk'); else if (shot === 'hit') cls.push('hit'); else if (shot === 'miss') cls.push('miss');
    if (opts.last === i) cls.push('last');
    if (kind === 'target' && !shot) cls.push('open');
    const data = kind === 'target' && !shot ? `data-fire="${i}"` : kind === 'place' && sh ? `data-rot="${sh.k}"` : '';
    h += `<${data ? 'button' : 'div'} class="${cls.join(' ')}" ${data} aria-label="${String.fromCharCode(65 + Math.floor(i / N))}${i % N + 1}"></${data ? 'button' : 'div'}>`;
  }
  return `<div class="board ${kind} ${opts.cls || ''}">${h}</div>`;
}
function fleetList(fleet, sunkNames) { return `<div class="fleet">${FLEET.map(([n, len]) => `<span class="${sunkNames.includes(n) ? 'gone' : ''}">${n} ${'■'.repeat(len)}</span>`).join('')}</div>`; }
function render() {
  if (UI.screen === 'home') { app.innerHTML = homeHTML(); return; }
  if (UI.screen === 'connecting') { app.innerHTML = `<div class="stack center" style="margin-top:30vh"><div style="font-size:60px">📡</div><h2 class="dots">Searching the seas</h2><button class="btn ghost" data-act="home">Cancel</button></div>`; return; }
  const v = UI.v; if (!v) return;
  const me = v.players.find(p => p.pid === Party.pid), foe = v.foe, amHost = v.host === Party.pid;
  const top = `<div class="top"><button class="iconbtn" data-act="quit">✕ Exit</button><div class="grow"></div>${v.code ? `<span class="mut" style="font-size:13px">Battle ${v.code}</span>` : ''}</div><div id="netbar">${netbar()}</div>`;
  if (v.phase === 'lobby') { app.innerHTML = top + lobbyHTML(v, amHost); return; }
  if (v.phase === 'place') {
    const iReady = me.ready;
    app.innerHTML = top + `<div class="banner">${iReady ? 'Fleet ready!' : 'Place your fleet'}</div>
      <p class="mut center" style="margin:0 0 10px;font-size:14px">${iReady ? (foe && !v.players.find(p => p.pid === foe.pid).ready ? `<span class="dots">Waiting for ${esc(foe.name)}</span>` : 'Starting…') : 'Tap a ship to turn it, or shuffle for a new layout.'}</p>
      ${grid(iReady ? 'mine' : 'place', v.me.fleet, {}, [])}
      ${iReady ? '' : `<div class="row2" style="margin-top:14px"><button class="btn ghost" data-act="shuffle">🎲 Shuffle</button><button class="btn" data-act="ready">⚓ Ready!</button></div>`}`;
    return;
  }
  // battle and over
  if (v.last && UI.lastShot !== v.gid + ':' + v.last.n) {
    UI.lastShot = v.gid + ':' + v.last.n;
    const mine = v.last.by === Party.pid;
    if (v.last.sunk) { SFX.sunk(); boom(mine ? '🔥 SUNK!' : '🔥 SUNK!', '#ff7a3d'); toast(mine ? `You sank their ${v.last.sunk}!` : `${esc(foe.name)} sank your ${v.last.sunk}!`); vibrate(mine ? 80 : [120, 60, 200]); }
    else if (v.last.hit) { SFX.hit(); boom('💥 HIT!', '#ffcc4d'); vibrate(mine ? 40 : [80, 40, 80]); }
    else { SFX.miss(); boom('💦 Miss', '#9fd8ff'); }
  }
  const myTurn = v.phase === 'battle' && v.turn === Party.pid;
  const sunkByMe = foe.sunk.map(s => s.n), sunkMine = v.me.fleet.filter(s => s.cells.every(x => v.me.shotsAtMe[x])).map(s => s.n);
  let banner;
  if (v.phase === 'over') {
    const won = v.winner === Party.pid;
    banner = `<div class="banner" style="font-size:30px;color:${won ? 'var(--accent)' : '#ff8a9c'}">${won ? '🏆 Victory!' : `${esc(foe.name)} wins!`}</div>`;
    if (UI.reported !== v.gid) {
      UI.reported = v.gid;
      if (won) { SFX.win(); confetti(40); }
      if (window.FamilyScores) FamilyScores.submit('battleships', v.solo ? 'computer' : 'friend', won ? 1 : 0, {player: me.name, detail: `vs ${foe.name}`});
    }
  } else banner = `<div class="banner ${myTurn ? 'go' : ''}">${myTurn ? '🎯 Your turn: fire!' : `<span class="dots">${esc(foe.name)} is aiming</span>`}</div>`;
  app.innerHTML = top + banner + `
    <div class="sec">${v.phase === 'over' ? `${esc(foe.name)}'s fleet` : 'Enemy waters'}</div>
    ${grid(myTurn ? 'target' : 'view', v.phase === 'over' ? foe.fleet : null, foe.myShots, foe.sunk, {cls: myTurn ? 'myturn' : '', last: v.last && v.last.by === Party.pid ? v.last.i : null})}
    ${fleetList(null, sunkByMe)}
    <div class="sec">Your fleet</div>
    ${grid('mine', v.me.fleet, v.me.shotsAtMe, v.me.fleet.filter(s => s.cells.every(x => v.me.shotsAtMe[x])), {cls: 'small', last: v.last && v.last.by !== Party.pid ? v.last.i : null})}
    ${fleetList(null, sunkMine)}
    ${v.phase === 'over' ? `<div class="stack" style="margin-top:14px">${amHost ? `<button class="btn" data-act="rematch">🔁 Rematch</button>` : '<div class="wait">The host can start a rematch.</div>'}<a class="btn ghost" href="../leaderboard/">🏆 Family leaderboard</a><button class="btn ghost" data-act="home">⚓ Battleships menu</button></div>` : ''}`;
}
function homeHTML() {
  const pre = Party.codeFromUrl();
  return `<div class="top"><a class="iconbtn" href="/">🏠 Main menu</a><div class="grow"></div><a class="iconbtn" href="../leaderboard/">🏆</a></div>
  <h1 class="title">Battleships</h1><p class="subtitle">Hide your fleet. Hunt theirs. Sink them all!</p>
  <div class="stack">
    <div class="panel"><div class="label">Your name</div><input class="txt" id="name" maxlength="16" placeholder="Type your name" value="${esc(Party.name())}" autocomplete="off" style="margin-top:6px"></div>
    <button class="btn" data-act="host">⚓ Play a friend (host)</button>
    <button class="btn alt" data-act="join">📱 Join a friend's battle${pre ? ' (' + pre + ')' : ''}</button>
    <button class="btn green" data-act="cpu">🤖 Play the computer</button>
    <a class="btn ghost" href="../leaderboard/">🏆 Family leaderboard</a>
    <a class="btn ghost" href="/">🏠 Exit to main menu</a>
  </div>`;
}
function lobbyHTML(v, amHost) {
  return `<div class="banner" style="font-size:28px">${amHost ? 'Waiting for a challenger' : 'You’re in!'}</div><div class="stack">
    ${v.code ? `<div class="panel center"><div class="label">Battle code</div><div class="code">${v.code.split('').map(c => `<span>${c}</span>`).join('')}</div>
      <div class="mut" style="font-size:14px">${amHost ? 'Your friend opens Battleships, taps <b>Join a friend’s battle</b> and types this code.' : 'Waiting for the host to start…'}</div>
      ${amHost && navigator.share ? `<button class="btn ghost sm" style="margin:10px auto 0" data-act="share">📤 Send invite link</button>` : ''}</div>` : `<div class="panel center"><span class="dots">Opening the harbour</span></div>`}
    <div class="panel"><div class="label" style="margin-bottom:8px">Captains (${v.players.length}/2)</div><div class="plist">${v.players.map(p => `<div class="pl"><span class="grow">${esc(p.name)}${p.pid === Party.pid ? ' (you)' : ''}</span>${!p.on ? '<span class="tag">📵</span>' : ''}</div>`).join('')}</div></div>
    <div class="panel"><div class="label" style="margin-bottom:8px">A hit means…</div>${amHost ? `<div class="chips"><button class="chip${v.bonus ? ' on' : ''}" data-act="bonus" data-on="1">💥 Fire again</button><button class="chip${!v.bonus ? ' on' : ''}" data-act="bonus" data-on="0">Take turns</button></div>` : `<b>${v.bonus ? '💥 Fire again' : 'Take turns'}</b>`}</div>
    ${amHost ? `<button class="btn" data-act="start" ${v.players.length < 2 ? 'disabled' : ''}>🚢 Set up fleets</button>${v.players.length < 2 ? '<div class="wait">Waiting for a second captain to join.</div>' : ''}` : '<div class="wait dots">Waiting for the host</div>'}
  </div>`;
}

/* ================= events ================= */
function needName() { const el = $('#name'), n = el ? el.value.trim() : Party.name(); if (!n) { toast('Type your name first!'); el && el.focus(); return false; } Party.setName(n); return true; }
document.addEventListener('click', e => {
  SFX.init();
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-act],[data-fire],[data-rot]');
  if (!el) return;
  if (el.dataset.fire !== undefined) { if (UI.v && UI.v.turn === Party.pid) { el.disabled = true; send({t: 'fire', i: +el.dataset.fire}); } return; }
  if (el.dataset.rot !== undefined) { send({t: 'rotate', k: +el.dataset.rot}); return; }
  switch (el.dataset.act) {
    case 'host': if (needName()) hostGame(); break;
    case 'cpu': if (needName()) playComputer(); break;
    case 'join':
      if (!needName()) break;
      openModal(`<div class="mbox panel stack"><h2 class="center">📱 Join a battle</h2><div class="mut center">Type the 4-letter code from your friend's phone.</div>
        <input class="txt center" id="code" maxlength="4" value="${esc(Party.codeFromUrl())}" placeholder="ABCD" autocomplete="off" autocapitalize="characters" style="font-size:32px;letter-spacing:10px">
        <button class="btn" data-act="dojoin">Join!</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
      setTimeout(() => $('#code') && $('#code').focus(), 50); break;
    case 'dojoin': joinGame($('#code').value); break;
    case 'close': closeModal(); break;
    case 'bonus': send({t: 'bonus', on: el.dataset.on === '1'}); break;
    case 'start': send({t: 'start'}); break;
    case 'shuffle': send({t: 'shuffle'}); break;
    case 'ready': send({t: 'ready'}); break;
    case 'rematch': send({t: 'rematch'}); break;
    case 'share': navigator.share({title: 'Battleships', text: 'Battle me! Code: ' + UI.v.code, url: Party.inviteLink(UI.v.code)}).catch(() => {}); break;
    case 'quit':
      if (UI.v && UI.v.phase !== 'over' && UI.v.phase !== 'lobby' && !confirm('Leave this battle?')) break;
      goHome(); break;
    case 'home': goHome(); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'name') Party.setName(e.target.value); if (e.target.id === 'code') e.target.value = Party.cleanCode(e.target.value); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') joinGame(e.target.value); });
render();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
