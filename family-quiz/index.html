<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Quiz Night</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1d1340">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Night">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="../kit.css">
<style>
:root{--bg:#1d1340;--bg2:#3a2a80;--accent:#ffcc33;--accent-ink:#1d1340;--display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c}
.qcard{background:#fff;color:#1d1340;border-radius:16px;padding:18px;text-align:center;font-size:clamp(1.2rem,4.8vw,1.7rem);font-weight:900;line-height:1.25;text-wrap:balance;margin:10px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{display:flex;align-items:center;gap:10px;min-height:96px;padding:12px;border:0;border-radius:14px;text-align:left;font-size:clamp(1rem,4.2vw,1.25rem);font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);line-height:1.2;cursor:pointer}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ans svg{flex:0 0 28px;height:28px}
.ans span{min-width:0;overflow-wrap:anywhere}
.ans small{display:block;font-weight:800;font-size:.8em;opacity:.95;margin-top:4px}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--yellow)}.c3{background:var(--green)}
.ans.dim{opacity:.25}.ans.pick{outline:5px solid #fff;outline-offset:2px}.ans.right{outline:5px solid #fff}
.ans:disabled{cursor:default}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{position:relative;width:64px;height:64px;flex:0 0 64px}
.timer svg{transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:400}
.lrow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:12px 14px;font-weight:800}
.lrow .name{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow .pts{font-family:var(--display);font-size:1.3rem}
.ok{color:#7dea5c}.bad{color:#ff8a9c}
.fast{color:var(--accent);font-size:12px;margin-left:6px}
.locked{text-align:center;margin-top:14px;font-family:var(--display);font-size:24px}
.big{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;text-align:center}
.hostbar{position:sticky;bottom:0;padding:14px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(rgba(29,19,64,0),var(--bg) 30%)}
/* pass-the-phone mode keeps its original look */
.pp p{margin:0;color:var(--mut);line-height:1.45}
.pp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pp .row>input{flex:1;min-width:0}
.pp input,.pp textarea{font:inherit;font-weight:700;color:#1d1340;background:#fff;border:0;border-radius:10px;padding:10px 12px;width:100%}
.pp textarea{min-height:110px;font-size:.9rem}
.pp .list{display:flex;flex-direction:column;gap:8px}
.pp .x{background:transparent;border:0;color:var(--mut);font-size:1.4rem;padding:4px 10px;cursor:pointer}
.pp .player-tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent);color:#1d1340;font-weight:900}
.pp .cent{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:60vh}
.pp .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.pp .step{flex:1;max-width:150px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:4px;background:var(--panel)}
.pp .step .n{font-family:var(--display);font-size:2rem}
.pp .s1{height:180px;background:var(--accent);color:#1d1340}.pp .s2{height:130px}.pp .s3{height:95px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="toast"></div>
<script src="../scores.js"></script>
<script src="../party.js"></script>
<script>
'use strict';
const SHAPES = [
  '<svg viewBox="0 0 28 28"><path d="M14 3 26 25H2Z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 28 28"><path d="M14 2 26 14 14 26 2 14Z" fill="#fff"/></svg>',
  '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#fff"/></svg>',
  '<svg viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" fill="#fff"/></svg>'];
// [question, correct, wrong, wrong, wrong]
const BANK = [
  ["Which is the largest planet in our Solar System?","Jupiter","Saturn","Earth","Neptune"],
  ["How many legs does a spider have?","8","6","10","12"],
  ["What is the capital of Australia?","Canberra","Sydney","Melbourne","Perth"],
  ["Which gas do plants take in from the air to make food?","Carbon dioxide","Oxygen","Helium","Nitrogen"],
  ["How many sides does a hexagon have?","6","5","7","8"],
  ["Which of these is a mammal?","Dolphin","Shark","Salmon","Octopus"],
  ["What is the fastest land animal?","Cheetah","Lion","Horse","Greyhound"],
  ["Who painted the Mona Lisa?","Leonardo da Vinci","Picasso","Van Gogh","Michelangelo"],
  ["How many days are there in a leap year?","366","365","364","367"],
  ["What is the longest river in the UK?","River Severn","River Thames","River Trent","River Wye"],
  ["Which planet is closest to the Sun?","Mercury","Venus","Mars","Earth"],
  ["At sea level, water boils at what temperature?","100°C","90°C","120°C","80°C"],
  ["What is 7 × 8?","56","54","48","64"],
  ["Which is the hardest natural substance?","Diamond","Gold","Iron","Granite"],
  ["In which country is the Eiffel Tower?","France","Italy","Spain","Belgium"],
  ["How many players does a football team have on the pitch?","11","10","9","12"],
  ["Taekwondo is a martial art from which country?","Korea","Japan","China","Thailand"],
  ["Which planet is known as the Red Planet?","Mars","Jupiter","Venus","Mercury"],
  ["What is the square root of 81?","9","8","7","81"],
  ["What is the longest bone in the human body?","Femur","Spine","Humerus","Tibia"],
  ["Which is the largest ocean on Earth?","Pacific","Atlantic","Indian","Arctic"],
  ["How many continents are there?","7","5","6","8"],
  ["What is the chemical symbol for gold?","Au","Go","Gd","Ag"],
  ["In which year did World War II end?","1945","1918","1939","1950"],
  ["What is the national animal of Scotland?","Unicorn","Lion","Red deer","Golden eagle"],
  ["What is the tallest mountain in the world?","Mount Everest","K2","Ben Nevis","Kilimanjaro"],
  ["What is the capital of Wales?","Cardiff","Swansea","Newport","Bangor"],
  ["How many hours are there in a day?","24","12","48","20"],
  ["What colour do you get mixing blue and yellow paint?","Green","Purple","Orange","Brown"],
  ["Which animal is known as the 'ship of the desert'?","Camel","Horse","Elephant","Lizard"],
  ["How many minutes are in an hour and a half?","90","60","100","150"],
  ["Which is the smallest prime number?","2","1","3","0"]
];
const PREFIX = 'familyquiz-v1-';
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
function openModal(h) { const m = $('#modal'); m.innerHTML = h; m.classList.add('on'); }
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
function confetti(n) {
  const bits = ['🎉', '⭐', '✨', '🏆', '🎊'];
  for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'conf'; d.textContent = bits[i % bits.length]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (2 + Math.random() * 2.5) + 's'; d.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 6000); }
}
const SFX = {
  ctx: null,
  init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t, d, type, v) { if (!this.ctx) return; const c = this.ctx, o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t; o.type = type || 'triangle'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v || .18, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .05); },
  go() { [523, 784].forEach((f, i) => this.tone(f, i * .1, .25)); },
  lock() { this.tone(660, 0, .12, 'square', .08); },
  right() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .09, .3)); },
  wrong() { [330, 247].forEach((f, i) => this.tone(f, i * .15, .3, 'sawtooth', .08)); },
  win() { [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .13, .3)); },
};
function ring(left) { const r = 28, c = 2 * Math.PI * r; return `<svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - left)}"/></svg>`; }
const mineQs = () => String(store('fq-mine') || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(r => r.length >= 3 && r.slice(0, 3).every(Boolean)).map(r => r.slice(0, 5).filter(Boolean));
function buildQs(count, useMine) {
  const mine = mineQs();
  const pool = useMine === 'only' && mine.length ? shuffle(mine).slice(0, count)
    : (m => shuffle(m.concat(shuffle(BANK).slice(0, count - m.length))))(shuffle(mine).slice(0, count));
  return pool.map(r => { const opts = shuffle(r.slice(1).map((t, i) => ({t, ok: i === 0}))); return {q: r[0], opts: opts.map(o => o.t), right: opts.findIndex(o => o.ok)}; });
}

/* ================= HOST: runs the quiz ================= */
let H = null;   // {room, code, players, settings, phase, qs, qi, answers, timer, gid}
let C = null;   // joining phone's connection
const UI = {screen: 'home', v: null, key: '', qStart: 0, tick: null, offline: false, reported: null};

function hostStart() {
  H = {room: null, code: null, phase: 'lobby', qs: [], qi: 0, answers: {}, gid: '',
    settings: {count: 10, secs: 20, useMine: 'mix'},
    players: [{pid: Party.pid, name: Party.name() || 'Quizmaster', score: 0, streak: 0}]};
  UI.screen = 'game'; push();
  Party.host(PREFIX, {
    onOpen: code => { H.code = code; push(); },
    onJoin: (pid, hello) => {
      const p = H.players.find(x => x.pid === pid);
      if (p) { p.name = String(hello.name || p.name).slice(0, 16); return true; }
      if (H.phase !== 'lobby') return 'That quiz has already started. Ask the quizmaster to start a new one.';
      if (H.players.length >= 12) return 'That quiz is full (12 players).';
      H.players.push({pid, name: String(hello.name || 'Player').slice(0, 16), score: 0, streak: 0});
      return true;
    },
    onConnect: () => push(),
    onLeave: () => { push(); checkAll(); },
    onMessage: (pid, m) => act(pid, m),
    onError: t => toast(t),
  }).then(r => { H.room = r; }).catch(() => { toast('Could not load the connection helper. Check your internet.'); goHome(); });
}
const isOn = pid => pid === Party.pid || (H.room && H.room.isOn(pid));
function viewFor(pid) {
  const q = H.qs[H.qi], showQ = ['question', 'reveal'].includes(H.phase);
  const needs = H.players.filter(p => isOn(p.pid)).map(p => p.pid);
  return {
    phase: H.phase, code: H.code, host: Party.pid, gid: H.gid, settings: H.settings, qi: H.qi, total: H.qs.length,
    players: H.players.map(p => ({pid: p.pid, name: p.name, score: p.score, streak: p.streak, on: isOn(p.pid)})),
    q: showQ ? q.q : null, opts: showQ ? q.opts : null,
    mine: H.answers[pid] ? H.answers[pid].i : null, answered: Object.keys(H.answers).filter(id => needs.includes(id)).length, need: needs.length,
    right: H.phase === 'reveal' ? q.right : null, answers: H.phase === 'reveal' ? H.answers : null,
  };
}
function push() {
  if (!H) return;
  if (H.room) H.players.forEach(p => { if (p.pid !== Party.pid) H.room.send(p.pid, {t: 'state', v: viewFor(p.pid)}); });
  UI.v = viewFor(Party.pid); render();
}
function act(pid, m) {
  const isHost = pid === Party.pid;
  switch (m.t) {
    case 'answer': {
      if (H.phase !== 'question' || m.qi !== H.qi || H.answers[pid] || !(m.i >= 0 && m.i < 4)) return;
      const q = H.qs[H.qi], ms = Math.max(0, Math.min(+m.ms || 0, H.settings.secs * 1000)), ok = m.i === q.right;
      H.answers[pid] = {i: m.i, ms, ok, pts: ok ? Math.round(500 + 500 * Math.max(0, 1 - ms / (H.settings.secs * 1000))) : 0};
      push(); checkAll(); break;
    }
    case 'settings': if (isHost && H.phase === 'lobby') { Object.assign(H.settings, m.s); push(); } break;
    case 'start':
      if (!isHost || H.phase !== 'lobby') return;
      H.qs = buildQs(H.settings.count, H.settings.useMine); H.qi = 0; H.gid = Math.random().toString(36).slice(2, 8);
      H.players.forEach(p => { p.score = 0; p.streak = 0; });
      askQuestion(); break;
    case 'next':
      if (!isHost) return;
      if (H.phase === 'reveal') { H.phase = H.qi + 1 >= H.qs.length ? 'final' : 'board'; push(); }
      else if (H.phase === 'board') { H.qi++; askQuestion(); }
      break;
    case 'again': if (isHost && H.phase === 'final') { H.phase = 'lobby'; H.players = H.players.filter(p => isOn(p.pid)); push(); } break;
  }
}
function askQuestion() {
  H.phase = 'question'; H.answers = {};
  clearTimeout(H.timer);
  H.timer = setTimeout(reveal, H.settings.secs * 1000 + 1500);   // a little extra for phones that saw it late
  push();
}
function checkAll() {
  if (!H || H.phase !== 'question') return;
  const need = H.players.filter(p => isOn(p.pid));
  if (need.every(p => H.answers[p.pid])) { clearTimeout(H.timer); H.timer = setTimeout(reveal, 700); }
}
function reveal() {
  if (!H || H.phase !== 'question') return;
  const fastest = Object.entries(H.answers).filter(([, a]) => a.ok).sort((a, b) => a[1].ms - b[1].ms)[0];
  if (fastest) { fastest[1].fast = true; fastest[1].pts += 200; }
  H.players.forEach(p => { const a = H.answers[p.pid]; if (a && a.ok) { p.score += a.pts; p.streak++; } else p.streak = 0; });
  H.phase = 'reveal'; push();
}

/* ================= JOINING PHONE ================= */
function joinQuiz(code) {
  code = Party.cleanCode(code);
  if (code.length !== 4) return toast('The quiz code has 4 letters.');
  closeModal(); UI.screen = 'connecting'; render();
  Party.join(PREFIX, code, {
    onMessage: d => { if (d.t === 'state') { UI.v = d.v; UI.screen = 'game'; render(); } },
    onStatus: s => { UI.offline = s === 'lost'; const nb = $('#netbar'); if (nb) nb.innerHTML = netbar(); else render(); },
    onFail: t => { toast(t); goHome(); },
  }).then(c => { C = c; }).catch(() => { toast('Could not load the connection helper. Check your internet.'); goHome(); });
}
function send(m) {
  if (H) act(Party.pid, m);
  else if (C && !C.send(m)) toast('Not connected right now. Reconnecting…');
}
function goHome() {
  if (H && H.room) H.room.close();
  if (C) C.close();
  clearTimeout(H && H.timer); clearInterval(UI.tick);
  H = null; C = null; UI.screen = 'home'; UI.v = null; UI.key = ''; UI.offline = false;
  app.onclick = null; render();
}
const netbar = () => UI.offline ? `<div class="netbar">📡 Lost connection to the quizmaster. Reconnecting…</div>` : '';

/* ================= SCREENS ================= */
function render() {
  if (UI.screen === 'home') { UI.key = 'home'; clearInterval(UI.tick); app.innerHTML = homeHTML(); return; }
  if (UI.screen === 'connecting') { UI.key = 'conn'; app.innerHTML = `<div class="stack center" style="margin-top:30vh"><div style="font-size:60px">📡</div><h2 class="dots">Finding the quiz</h2><button class="btn ghost" data-act="home">Cancel</button></div>`; return; }
  if (UI.screen !== 'game' || !UI.v) return;
  const v = UI.v, key = v.phase + ':' + v.qi + ':' + v.gid;
  if (key !== UI.key) { UI.key = key; if (v.phase === 'question') { UI.qStart = performance.now(); SFX.go(); } }
  const me = v.players.find(p => p.pid === Party.pid), amHost = v.host === Party.pid;
  const top = `<div class="top"><button class="iconbtn" data-act="quit">✕ Exit</button><div class="grow"></div>${v.code ? `<span class="mut" style="font-size:13px">Quiz ${v.code}</span>` : ''}${me ? `<span class="tag on">${me.score} pts</span>` : ''}</div><div id="netbar">${netbar()}</div>`;
  clearInterval(UI.tick);
  if (v.phase === 'lobby') app.innerHTML = top + lobbyHTML(v, amHost);
  else if (v.phase === 'question') { app.innerHTML = top + questionHTML(v); startTimer(v); }
  else if (v.phase === 'reveal') app.innerHTML = top + revealHTML(v, amHost);
  else if (v.phase === 'board') app.innerHTML = top + boardHTML(v, amHost);
  else if (v.phase === 'final') { app.innerHTML = top + finalHTML(v, amHost); report(v); }
}
function homeHTML() {
  const pre = Party.codeFromUrl();
  return `<div class="top"><a class="iconbtn" href="/">🏠 Main menu</a><div class="grow"></div><a class="iconbtn" href="../leaderboard/">🏆</a></div>
  <h1 class="title">Family Quiz Night</h1><p class="subtitle">Everyone answers on their own phone. Fastest correct answers score the most!</p>
  <div class="stack">
    <div class="panel"><div class="label">Your name</div><input class="txt" id="name" maxlength="16" placeholder="Type your name" value="${esc(Party.name())}" autocomplete="off" style="margin-top:6px"></div>
    <button class="btn" data-act="host">🎤 Be the quizmaster (host)</button>
    <button class="btn alt" data-act="join">📱 Join a quiz${pre ? ' (' + pre + ')' : ''}</button>
    <button class="btn ghost" data-act="pass">🔁 One phone: pass it round</button>
    <a class="btn ghost" href="../leaderboard/">🏆 Family leaderboard</a>
    <a class="btn ghost" href="/">🏠 Exit to main menu</a>
  </div>`;
}
function lobbyHTML(v, amHost) {
  const st = v.settings, mine = mineQs().length;
  return `<div class="big" style="margin:6px 0 12px">${amHost ? 'Gather the players' : 'You’re in!'}</div>
  <div class="stack">
    ${v.code ? `<div class="panel center"><div class="label">Quiz code</div><div class="code">${v.code.split('').map(c => `<span>${c}</span>`).join('')}</div>
      <div class="mut" style="font-size:14px">${amHost ? 'Everyone opens Family Quiz Night, taps <b>Join a quiz</b> and types this code.' : 'Waiting for the quizmaster to start…'}</div>
      ${amHost && navigator.share ? `<button class="btn ghost sm" style="margin:10px auto 0" data-act="share">📤 Send invite link</button>` : ''}</div>` : `<div class="panel center"><span class="dots">Opening the quiz</span></div>`}
    <div class="panel"><div class="label" style="margin-bottom:8px">Players (${v.players.length})</div><div class="plist">${v.players.map(p => `<div class="pl"><span class="grow">${esc(p.name)}${p.pid === Party.pid ? ' (you)' : ''}</span>${p.pid === v.host ? '<span class="tag">QUIZMASTER</span>' : ''}${!p.on ? '<span class="tag">📵</span>' : ''}</div>`).join('')}</div></div>
    ${amHost ? `<div class="panel stack">
      <div><div class="label" style="margin-bottom:6px">Questions</div><div class="chips">${[5, 10, 15, 20].map(n => `<button class="chip${st.count === n ? ' on' : ''}" data-set="count" data-val="${n}">${n}</button>`).join('')}</div></div>
      <div><div class="label" style="margin-bottom:6px">Seconds per question</div><div class="chips">${[10, 20, 30].map(n => `<button class="chip${st.secs === n ? ' on' : ''}" data-set="secs" data-val="${n}">${n}s</button>`).join('')}</div></div>
      <div><div class="label" style="margin-bottom:6px">Your own questions (optional)</div>
        <div class="mut" style="font-size:13px;margin-bottom:6px">One per line: question | right answer | wrong | wrong | wrong</div>
        <textarea class="txt" id="mine" placeholder="What is Grandma's middle name? | Rose | Mary | Jane | Ann">${esc(store('fq-mine') || '')}</textarea>
        <div class="chips" style="margin-top:8px">${[['mix', 'Mix with built-in'], ['only', 'Only mine']].map(([k, t]) => `<button class="chip${st.useMine === k ? ' on' : ''}" data-set="useMine" data-val="${k}">${t}</button>`).join('')}<span class="mut" id="mcount" style="align-self:center;font-size:13px">${mine} saved</span></div></div>
    </div>
    <button class="btn" data-act="start" ${v.players.length < 1 ? 'disabled' : ''}>▶️ Start the quiz</button>` : `<div class="wait dots">Waiting for the quizmaster to start</div>`}
  </div>`;
}
function questionHTML(v) {
  const done = v.mine !== null;
  return `<div class="qtop"><span class="label">Question ${v.qi + 1} of ${v.total}</span><div class="timer" id="tm">${ring(1)}<b>${v.settings.secs}</b></div></div>
  <div class="qcard popin">${esc(v.q)}</div>
  <div class="grid">${v.opts.map((o, i) => `<button class="ans c${i}${done ? (v.mine === i ? ' pick' : ' dim') : ''}" data-ans="${i}" ${done ? 'disabled' : ''}>${SHAPES[i]}<span>${esc(o)}</span></button>`).join('')}</div>
  ${done ? `<div class="locked popin">🔒 Locked in!</div>` : ''}
  <div class="wait">${v.answered} of ${v.need} answered</div>`;
}
function startTimer(v) {
  const secs = v.settings.secs;
  const draw = () => {
    const el = (performance.now() - UI.qStart) / 1000, left = Math.max(0, 1 - el / secs), tm = $('#tm');
    if (tm) tm.innerHTML = ring(left) + `<b>${Math.ceil(secs * left)}</b>`;
    if (left <= 0) { clearInterval(UI.tick); document.querySelectorAll('.ans').forEach(b => { b.disabled = true; }); }
  };
  draw(); UI.tick = setInterval(draw, 100);
}
function revealHTML(v, amHost) {
  const rows = v.players.slice().sort((a, b) => ((v.answers[b.pid] || {}).pts || 0) - ((v.answers[a.pid] || {}).pts || 0));
  const mine = v.answers[Party.pid];
  if (UI.revealed !== UI.key) { UI.revealed = UI.key; if (mine && mine.ok) { SFX.right(); if (mine.fast) confetti(16); } else SFX.wrong(); }
  return `<div class="qtop"><span class="label">Question ${v.qi + 1} of ${v.total}</span>${mine ? `<span class="${mine.ok ? 'ok' : 'bad'}" style="font-family:var(--display);font-size:22px">${mine.ok ? '✅ +' + mine.pts : '❌ ' + (mine.i < 0 ? 'Too slow' : 'Wrong')}</span>` : '<span class="bad">⏰ Too slow</span>'}</div>
  <div class="qcard">${esc(v.q)}</div>
  <div class="grid">${v.opts.map((o, i) => { const who = v.players.filter(p => v.answers[p.pid] && v.answers[p.pid].i === i); return `<div class="ans c${i} ${i === v.right ? 'right' : 'dim'}">${SHAPES[i]}<span>${esc(o)}${who.length ? `<small>${who.map(p => esc(p.name)).join(', ')}</small>` : ''}</span></div>`; }).join('')}</div>
  <div class="stack" style="margin-top:12px">${rows.map(p => { const a = v.answers[p.pid]; return `<div class="lrow"><span class="name">${esc(p.name)}${a && a.fast ? '<span class="fast">⚡ Fastest finger +200</span>' : ''}${p.streak >= 2 ? `<span class="fast">🔥 ${p.streak} in a row</span>` : ''}</span><span class="${a && a.ok ? 'ok' : 'bad'}">${a ? (a.ok ? '+' + a.pts : 'Wrong') : 'Too slow'}</span></div>`; }).join('')}</div>
  <div class="hostbar">${amHost ? `<button class="btn" data-act="next">${v.qi + 1 >= v.total ? '🏆 Final results' : '📊 Scoreboard'} ➜</button>` : `<div class="wait dots">Waiting for the quizmaster</div>`}</div>`;
}
function boardHTML(v, amHost) {
  const r = v.players.slice().sort((a, b) => b.score - a.score);
  return `<div class="big" style="margin:6px 0 14px">Scoreboard</div>
  <div class="stack">${r.map((p, k) => `<div class="lrow popin" style="animation-delay:${k * 80}ms"><span class="label" style="width:22px">${k + 1}</span><span class="name">${esc(p.name)}${p.pid === Party.pid ? ' (you)' : ''}</span><span class="pts">${p.score}</span></div>`).join('')}</div>
  <div class="hostbar">${amHost ? `<button class="btn" data-act="next">Next question ➜</button>` : `<div class="wait dots">Waiting for the quizmaster</div>`}</div>`;
}
function finalHTML(v, amHost) {
  const r = v.players.slice().sort((a, b) => b.score - a.score), pod = r.slice(0, 3);
  if (UI.cheered !== v.gid) { UI.cheered = v.gid; SFX.win(); confetti(40); }
  return `<div class="label center">Winner</div><div class="big popin" style="margin:6px 0">${esc(r[0].name)}</div>
  <div class="podium">${[1, 0, 2].map(i => pod[i] ? `<div class="pod p${i + 1}"><div class="m">${['🥇', '🥈', '🥉'][i]}</div><div class="n">${esc(pod[i].name)}</div><div>${pod[i].score}</div></div>` : '<div></div>').join('')}</div>
  ${r.length > 3 ? `<div class="stack">${r.slice(3).map((p, k) => `<div class="lrow"><span class="label" style="width:22px">${k + 4}</span><span class="name">${esc(p.name)}</span><span class="pts">${p.score}</span></div>`).join('')}</div>` : ''}
  <div class="stack" style="margin-top:14px">${amHost ? `<button class="btn" data-act="again">🔁 Play again</button>` : `<div class="wait">The quizmaster can start another round.</div>`}
    <a class="btn ghost" href="../leaderboard/">🏆 Family leaderboard</a><button class="btn ghost" data-act="home">🏠 Quiz menu</button></div>`;
}
// Each phone sends its own player's result to the family leaderboard once per quiz.
function report(v) {
  if (!window.FamilyScores || UI.reported === v.gid) return;
  UI.reported = v.gid;
  const r = v.players.slice().sort((a, b) => b.score - a.score), me = r.find(p => p.pid === Party.pid);
  if (!me) return;
  const won = me.score === r[0].score && r.filter(p => p.score === r[0].score).length === 1 && r.length > 1;
  FamilyScores.submit('familyquiz', 'wins', won ? 1 : 0, {player: me.name, detail: `${r.indexOf(me) + 1} of ${r.length}, ${me.score} pts`});
  FamilyScores.submit('familyquiz', 'best', me.score, {player: me.name});
}

/* ================= ONE PHONE: pass it round (the original game) ================= */
function passMode() {
  const S = {players: ['Dad', 'Mum'], count: 10, secs: 20, useMine: 'mix', scores: {}, streak: {}, qs: [], qi: 0, turn: 0, answers: {}, t0: 0, tick: null};
  try { const p = JSON.parse(store('fq-players') || 'null'); if (Array.isArray(p) && p.length) S.players = p; } catch (e) {}
  UI.screen = 'pass';
  const save = () => store('fq-players', JSON.stringify(S.players));
  const wrapTop = h => `<div class="pp"><div class="top"><button class="iconbtn" data-act="home">← Quiz menu</button><div class="grow"></div><a class="iconbtn" href="/">🏠</a></div>${h}</div>`;
  function setup() {
    clearInterval(S.tick);
    app.innerHTML = wrapTop(`<h1 class="title" style="font-size:36px">One phone</h1><p class="subtitle">Pass it round. Faster correct answers score more.</p>
    <div class="stack"><div class="panel stack"><div class="label">Players</div>
      <div class="list">${S.players.map((p, i) => `<div class="row"><input id="p${i}" value="${esc(p)}" aria-label="Player ${i + 1} name" maxlength="16">${S.players.length > 2 ? `<button class="x" data-del="${i}" aria-label="Remove">×</button>` : ''}</div>`).join('')}</div>
      ${S.players.length < 8 ? `<button class="btn ghost sm" id="add">+ Add player</button>` : ''}</div>
    <div class="panel stack"><div class="label">Questions</div><div class="chips">${[5, 10, 15, 20].map(n => `<button class="chip${S.count === n ? ' on' : ''}" data-count="${n}">${n}</button>`).join('')}</div>
      <div class="label">Seconds per question</div><div class="chips">${[10, 20, 30].map(n => `<button class="chip${S.secs === n ? ' on' : ''}" data-secs="${n}">${n}s</button>`).join('')}</div>
      <div class="label">Questions to use</div><div class="chips">${[['mix', 'Mix with my own'], ['only', 'Only my own']].map(([k, t]) => `<button class="chip${S.useMine === k ? ' on' : ''}" data-mine="${k}">${t}</button>`).join('')}</div>
      <div class="mut" style="font-size:13px">${mineQs().length} of your own questions saved (add them in the quizmaster screen).</div></div>
    <button class="btn" id="go">Start quiz</button></div>`);
    const grab = () => { S.players = S.players.map((_, i) => ($('#p' + i) ? $('#p' + i).value.trim() : '') || `Player ${i + 1}`); save(); };
    app.onclick = e => {
      const b = e.target.closest('button'); if (!b || b.dataset.act) return; grab();
      if (b.id === 'add') { S.players.push(`Player ${S.players.length + 1}`); setup(); }
      else if (b.dataset.del) { S.players.splice(+b.dataset.del, 1); setup(); }
      else if (b.dataset.count) { S.count = +b.dataset.count; setup(); }
      else if (b.dataset.secs) { S.secs = +b.dataset.secs; setup(); }
      else if (b.dataset.mine) { S.useMine = b.dataset.mine; setup(); }
      else if (b.id === 'go') start();
    };
  }
  function start() {
    S.qs = buildQs(S.count, S.useMine);
    S.scores = {}; S.streak = {}; S.players.forEach(p => { S.scores[p] = 0; S.streak[p] = 0; });
    S.qi = 0; S.turn = 0; S.answers = {}; pass();
  }
  function pass() {
    app.onclick = null;
    app.innerHTML = wrapTop(`<div class="cent popin"><p>Question ${S.qi + 1} of ${S.qs.length}. Pass the phone to</p><div class="big">${esc(S.players[S.turn])}</div><p>No peeking, everyone else!</p><button class="btn" id="ready" style="width:auto">I'm ready</button></div>`);
    $('#ready').onclick = ask;
  }
  function ask() {
    const q = S.qs[S.qi];
    app.innerHTML = wrapTop(`<div class="qtop"><span class="player-tag">${esc(S.players[S.turn])}</span><div class="timer" id="tm">${ring(1)}<b>${S.secs}</b></div></div>
    <div class="qcard popin">${esc(q.q)}</div><div class="grid">${q.opts.map((o, i) => `<button class="ans c${i}" data-i="${i}">${SHAPES[i]}<span>${esc(o)}</span></button>`).join('')}</div>`);
    S.t0 = performance.now(); clearInterval(S.tick);
    S.tick = setInterval(() => { const el = (performance.now() - S.t0) / 1000, left = Math.max(0, 1 - el / S.secs); const tm = $('#tm'); if (tm) tm.innerHTML = ring(left) + `<b>${Math.ceil(S.secs * left)}</b>`; if (left <= 0) lock(-1); }, 100);
    app.onclick = e => { const b = e.target.closest('.ans'); if (b) lock(+b.dataset.i); };
  }
  function lock(i) {
    clearInterval(S.tick); app.onclick = null;
    const q = S.qs[S.qi], p = S.players[S.turn], el = (performance.now() - S.t0) / 1000, ok = i === q.right;
    const pts = ok ? Math.round(500 + 500 * Math.max(0, 1 - el / S.secs)) : 0;
    S.answers[p] = {i, ok, pts};
    if (ok) { S.scores[p] += pts; S.streak[p]++; } else S.streak[p] = 0;
    S.turn++;
    if (S.turn < S.players.length) {
      app.innerHTML = wrapTop(`<div class="cent popin"><h2>${i < 0 ? 'Time’s up!' : 'Answer locked in'}</h2><p>Keep it secret. Next up: <b style="color:#fff">${esc(S.players[S.turn])}</b></p><button class="btn" id="nx" style="width:auto">Pass it on</button></div>`);
      $('#nx').onclick = pass;
    } else reveal();
  }
  function reveal() {
    const q = S.qs[S.qi];
    app.innerHTML = wrapTop(`<span class="label">Question ${S.qi + 1} of ${S.qs.length}</span><div class="qcard">${esc(q.q)}</div>
    <div class="grid">${q.opts.map((o, i) => { const who = S.players.filter(p => S.answers[p].i === i); return `<div class="ans c${i} ${i === q.right ? 'right' : 'dim'}">${SHAPES[i]}<span>${esc(o)}${who.length ? `<small>${who.map(esc).join(', ')}</small>` : ''}</span></div>`; }).join('')}</div>
    <div class="stack" style="margin:12px 0">${S.players.map(p => { const a = S.answers[p]; return `<div class="lrow"><span class="name">${esc(p)}${S.streak[p] >= 2 ? `<span class="fast">🔥 ${S.streak[p]} in a row</span>` : ''}</span><span class="${a.ok ? 'ok' : 'bad'}">${a.ok ? '+' + a.pts : (a.i < 0 ? 'Too slow' : 'Wrong')}</span></div>`; }).join('')}</div>
    <button class="btn" id="nx">${S.qi + 1 < S.qs.length ? 'Scoreboard' : 'Final results'}</button>`);
    $('#nx').onclick = board;
  }
  const ranked = () => S.players.slice().sort((a, b) => S.scores[b] - S.scores[a]);
  function board() {
    if (S.qi + 1 >= S.qs.length) return finish();
    app.innerHTML = wrapTop(`<div class="big" style="margin:6px 0 14px">Scoreboard</div><div class="stack">${ranked().map((p, k) => `<div class="lrow popin"><span class="label" style="width:22px">${k + 1}</span><span class="name">${esc(p)}</span><span class="pts">${S.scores[p]}</span></div>`).join('')}</div>
    <button class="btn" id="nx" style="margin-top:14px">Next question</button>`);
    $('#nx').onclick = () => { S.qi++; S.turn = 0; S.answers = {}; pass(); };
  }
  function finish() {
    const r = ranked(), order = [r[1], r[0], r[2]], cls = ['s2', 's1', 's3'], place = [2, 1, 3];
    SFX.win(); confetti(40);
    app.innerHTML = wrapTop(`<div class="cent"><p class="label">Winner</p><div class="big popin">${esc(r[0])}</div>
    <div class="podium">${order.map((p, k) => p ? `<div class="step ${cls[k]}"><span class="n">${place[k]}</span><span>${esc(p)}</span><span>${S.scores[p]}</span></div>` : '').join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="again" style="width:auto">Play again</button><button class="btn ghost" id="set" style="width:auto">Change settings</button></div></div>`);
    $('#again').onclick = start; $('#set').onclick = setup;
  }
  setup();
}

/* ================= EVENTS ================= */
function needName() {
  const el = $('#name'), n = el ? el.value.trim() : Party.name();
  if (!n) { toast('Type your name first!'); el && el.focus(); return false; }
  Party.setName(n); return true;
}
document.addEventListener('click', e => {
  SFX.init();
  const el = e.target.closest('[data-act],[data-set],[data-ans]');
  if (e.target.id === 'modal') { closeModal(); return; }
  if (!el) return;
  if (el.dataset.ans !== undefined) {
    const v = UI.v; if (!v || v.phase !== 'question' || v.mine !== null) return;
    const ms = Math.round(performance.now() - UI.qStart);
    if (ms > v.settings.secs * 1000) return;
    SFX.lock(); vibrate(30);
    document.querySelectorAll('.ans').forEach((b, i) => { b.disabled = true; b.classList.add(i === +el.dataset.ans ? 'pick' : 'dim'); });
    send({t: 'answer', i: +el.dataset.ans, ms, qi: v.qi});
    return;
  }
  if (el.dataset.set) {
    const val = isNaN(+el.dataset.val) ? el.dataset.val : +el.dataset.val;
    send({t: 'settings', s: {[el.dataset.set]: val}}); return;
  }
  switch (el.dataset.act) {
    case 'host': if (needName()) hostStart(); break;
    case 'join': {
      if (!needName()) break;
      openModal(`<div class="mbox panel stack"><h2 class="center">📱 Join a quiz</h2><div class="mut center">Type the 4-letter code from the quizmaster's phone.</div>
        <input class="txt center" id="code" maxlength="4" value="${esc(Party.codeFromUrl())}" placeholder="ABCD" autocomplete="off" autocapitalize="characters" style="font-size:32px;letter-spacing:10px">
        <button class="btn" data-act="dojoin">Join!</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
      setTimeout(() => $('#code') && $('#code').focus(), 50); break;
    }
    case 'dojoin': joinQuiz($('#code').value); break;
    case 'close': closeModal(); break;
    case 'pass': passMode(); break;
    case 'start': if (H) { store('fq-mine', ($('#mine') || {}).value || store('fq-mine') || ''); } send({t: 'start'}); break;
    case 'next': send({t: 'next'}); break;
    case 'again': send({t: 'again'}); break;
    case 'share': navigator.share({title: 'Family Quiz Night', text: 'Join my quiz! Code: ' + UI.v.code, url: Party.inviteLink(UI.v.code)}).catch(() => {}); break;
    case 'quit':
      if (H && H.players.length > 1 && !confirm('You’re the quizmaster. Leaving ends the quiz for everyone. Leave?')) break;
      if (C && UI.v && UI.v.phase !== 'final' && !confirm('Leave this quiz?')) break;
      goHome(); break;
    case 'home': goHome(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'name') Party.setName(e.target.value);
  if (e.target.id === 'code') e.target.value = Party.cleanCode(e.target.value);
  if (e.target.id === 'mine') { store('fq-mine', e.target.value); const m = $('#mcount'); if (m) m.textContent = mineQs().length + ' saved'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') joinQuiz(e.target.value); });
window.addEventListener('beforeunload', e => { if (H && H.players.length > 1) { e.preventDefault(); e.returnValue = ''; } });
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
render();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
