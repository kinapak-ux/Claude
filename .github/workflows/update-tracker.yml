name: Update FPL tracker

on:
  schedule:
    - cron: "17 6,18 * * *"   # twice a day (UTC)
  workflow_dispatch:          # lets you click "Run workflow" to refresh now
    inputs:
      send_email:
        description: "Send the deadline email now (for testing)"
        type: boolean
        default: false
  push:
    branches: [main, claude/fpl-news-tracker-design-4jivwl]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        env:
          TEAM_ID: "2612117"
          LEAGUES: "New Longton Legends"
          PAGE_URL: "https://kinapak-ux.github.io/Claude/"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build.py --email ${{ inputs.send_email && 'force' || (github.event_name == 'schedule' && 'auto' || 'off') }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
