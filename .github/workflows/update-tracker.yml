name: Update FPL tracker

on:
  schedule:
    - cron: "17 6,18 * * *"   # twice a day (UTC)
  workflow_dispatch:          # lets you click "Run workflow" to refresh now
  push:
    branches: [main, claude/fpl-news-tracker-design-4jivwl]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        env:
          TEAM_ID: "2612117"
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
