name: Update FPL tracker

on:
  schedule:
    - cron: "17 6,18 * * *"     # twice a day (UTC); the morning run sends the deadline email
    - cron: "*/10 11-23 * * *"  # live scores: every 10 min, only rebuilds while matches are on
  workflow_dispatch:          # lets you click "Run workflow" to refresh now
    inputs:
      send_email:
        description: "Send the deadline email now (for testing)"
        type: boolean
        default: false
  push:
    branches: [main, claude/fpl-news-tracker-design-4jivwl]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for live matches
        id: check
        if: github.event.schedule == '*/10 11-23 * * *'
        run: python build.py --live-check
      - name: Build page
        if: steps.check.outcome == 'skipped' || steps.check.outputs.live == 'true'
        env:
          TEAM_ID: "2612117"
          LEAGUES: "New Longton Legends"
          LEAGUE_NICKNAMES: "New Longton Legends=NLLL"
          PAGE_URL: "https://kinapak-ux.github.io/Claude/"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python build.py --email ${{ inputs.send_email && 'force' || (github.event.schedule == '17 6,18 * * *' && 'auto' || 'off') }}
      - name: Add Card Battler game
        if: steps.check.outcome == 'skipped' || steps.check.outputs.live == 'true'
        run: cp -r top-trumps site/top-trumps
      - if: steps.check.outcome == 'skipped' || steps.check.outputs.live == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outcome == 'skipped' || steps.check.outputs.live == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.check.outcome == 'skipped' || steps.check.outputs.live == 'true'
        uses: actions/deploy-pages@v4
