<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0718">
<title>Card Battler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0718;--ink:#f5ecff;--mut:#b9a8d6;--gold:#ffcc4d;--acc:#9b6bff;--bad:#ff5c7a;--ok:#5cffb0;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
html{background:#0d0718}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#3a1d6e 0%,#170c2e 45%,#0d0718 75%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#ffe9b0,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#cfe,transparent),radial-gradient(1.5px 1.5px at 60% 50%,#fff,transparent);background-size:300px 300px}
#app{position:relative;max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
button{font:inherit;color:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:17px;letter-spacing:.3px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#8a5cff,#5b2fd6);box-shadow:0 4px 0 #3a1a96,0 8px 22px rgba(120,70,255,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a1a96}
.btn.gold{background:linear-gradient(180deg,#ffd75e,#e09a12);color:#3a2000;box-shadow:0 4px 0 #9a6200,0 8px 22px rgba(255,190,40,.35)}
.btn.green{background:linear-gradient(180deg,#39d98a,#119a5c);box-shadow:0 4px 0 #0a6a3e,0 8px 22px rgba(40,220,140,.3)}
.btn.ghost{background:var(--panel);box-shadow:none;border:1px solid var(--line);font-weight:700}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.stack{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.mut{color:var(--mut)}
.center{text-align:center}
input.txt{width:100%;font:inherit;font-size:18px;font-weight:700;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);outline:none}
input.txt:focus{border-color:var(--acc)}
select.txt{width:100%;font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);background:#1d1236;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.topbar .grow{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:42px;height:42px;font-size:19px;cursor:pointer;display:grid;place-items:center}

/* ---------- Home ---------- */
.logo{text-align:center;margin:8px 0 2px}
.logo h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(34px,11vw,54px);line-height:1;background:linear-gradient(180deg,#fff6d0 0%,#ffcc4d 45%,#d9831a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2a00) drop-shadow(0 0 18px rgba(255,180,60,.45))}
.logo p{margin:6px 0 0;font-family:Cinzel,serif;letter-spacing:3px;font-size:12px;color:#d8c6ff;text-transform:uppercase}
.fan{position:relative;height:300px;margin:6px auto 4px;max-width:340px}
.fan .cardw{position:absolute;width:150px;left:50%;top:10px;transform-origin:50% 120%}
.fan .cardw:nth-child(1){transform:translateX(-50%) rotate(-16deg) translateX(-70px);animation:bob 5s ease-in-out infinite}
.fan .cardw:nth-child(2){transform:translateX(-50%) translateY(-6px);z-index:2;animation:bob 5s ease-in-out -1.6s infinite}
.fan .cardw:nth-child(3){transform:translateX(-50%) rotate(16deg) translateX(70px);animation:bob 5s ease-in-out -3.2s infinite}
@keyframes bob{50%{margin-top:-8px}}
.avatars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.3);font-size:24px;display:grid;place-items:center;cursor:pointer}
.av.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,204,77,.3);background:rgba(255,204,77,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- Lobby ---------- */
.code{display:flex;justify-content:center;gap:8px;margin:8px 0}
.code span{width:58px;height:70px;border-radius:14px;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:800;font-size:40px;background:linear-gradient(180deg,#2c1a55,#160c2e);border:2px solid #ffcc4d;color:#ffe08a;box-shadow:0 0 20px rgba(255,204,77,.3)}
.plist{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-weight:800}
.pl .a{font-size:26px}
.pl .grow{flex:1}
.pl .tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--mut)}
.pl .x{border:0;background:rgba(255,92,122,.2);color:#ffb3c1;border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:900}

/* ---------- HUD ---------- */
.hud{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hud::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:14px;background:rgba(0,0,0,.3);border:2px solid transparent;position:relative}
.chip .a{font-size:22px;line-height:1.1}
.chip .n{font-size:12px;font-weight:800;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .c{font-family:Cinzel,serif;font-weight:800;font-size:15px;color:var(--gold)}
.chip.me{background:rgba(155,107,255,.2)}
.chip.turn{border-color:var(--gold);box-shadow:0 0 14px rgba(255,204,77,.4)}
.chip.turn::before{content:"👑";position:absolute;top:-11px;font-size:16px}
.chip.out{opacity:.4;filter:grayscale(1)}
.chip.off .a::after{content:"📵";font-size:12px;position:absolute;right:4px;top:4px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--mut);margin:8px 2px}
.meta b{color:var(--ink)}
.banner{text-align:center;margin:8px 0 12px;font-family:Cinzel,serif;font-weight:800;font-size:19px;line-height:1.25}
.banner small{display:block;font-family:Nunito,sans-serif;font-weight:700;font-size:14px;color:var(--mut);margin-top:3px}
.banner.go{color:#ffe08a;text-shadow:0 0 16px rgba(255,204,77,.6);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.mycard{max-width:360px;margin:0 auto}
.foot{margin-top:14px}
.wait{text-align:center;color:var(--mut);font-weight:700;font-size:14px;margin-top:8px}

/* ---------- Card ---------- */
.cardw{container-type:inline-size;width:100%}
.card{position:relative;border-radius:5.5cqw;padding:2.4cqw;background:var(--frame);background-size:300% 300%;box-shadow:0 2.5cqw 7cqw rgba(0,0,0,.65),0 0 9cqw -2cqw var(--glow)}
.card.r-common{--frame:linear-gradient(145deg,#7d8898,#e2e8ef 28%,#5a6474 55%,#c9d1db 80%,#6c7686)}
.card.r-rare{--frame:linear-gradient(145deg,#1546c2,#8fd0ff 28%,#123a9a 55%,#62adff 80%,#1a4fd0)}
.card.r-epic{--frame:linear-gradient(145deg,#4f1696,#e0b0ff 28%,#3a0f78 55%,#bb7cff 80%,#5a1aa8)}
.card.r-legendary{--frame:linear-gradient(135deg,#9a6512,#ffe9a0 18%,#c08414 36%,#fff6d6 50%,#b07a10 66%,#ffd76a 84%,#8a5a0c);animation:goldflow 6s linear infinite}
@keyframes goldflow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.card-in{position:relative;border-radius:3.6cqw;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#2a1a48,#120a22 70%)}
.c-head{display:flex;align-items:center;gap:2cqw;padding:2.6cqw 3.4cqw 2.2cqw}
.c-name{flex:1;font-family:Cinzel,serif;font-weight:800;font-size:5.6cqw;line-height:1.1;text-shadow:0 .4cqw 0 #000}
.c-gem{font-size:6cqw;color:var(--rc);filter:drop-shadow(0 0 1.5cqw var(--rc))}
.c-art{position:relative;margin:0 2.4cqw;aspect-ratio:3/2;border-radius:3cqw;overflow:hidden;border:.6cqw solid rgba(255,255,255,.28);box-shadow:inset 0 0 6cqw rgba(0,0,0,.6)}
.c-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-crea{position:absolute;left:50%;bottom:7%;font-size:31cqw;line-height:1;transform:translateX(-50%);animation:float 4.5s ease-in-out infinite}
.c-crea span{display:block}
.c-acc{position:absolute;right:5%;bottom:6%;font-size:12cqw;line-height:1;transform:rotate(12deg);filter:drop-shadow(0 0 2cqw rgba(0,0,0,.8))}
.c-shadow{position:absolute;left:50%;bottom:4%;width:36%;height:7%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);border-radius:50%}
.c-rar{position:absolute;left:3%;top:5%;font-family:Cinzel,serif;font-weight:800;font-size:3cqw;letter-spacing:.5cqw;padding:.8cqw 2.2cqw;border-radius:99px;background:rgba(0,0,0,.55);color:var(--rc);border:.4cqw solid var(--rc)}
@keyframes float{50%{transform:translateX(-50%) translateY(-4%)}}
.c-power{margin:2.4cqw 2.4cqw 0;padding:1.8cqw 3cqw;border-radius:2.6cqw;background:linear-gradient(90deg,rgba(255,204,77,.2),rgba(155,107,255,.22));border:.4cqw solid rgba(255,220,120,.5);font-size:3.7cqw;line-height:1.3}
.c-power b{color:#ffe08a;font-family:Cinzel,serif;font-weight:800}
.c-stats{display:grid;gap:1.2cqw;padding:2.2cqw 2.4cqw}
.st{display:grid;grid-template-columns:7cqw 1fr 24cqw 9cqw;align-items:center;gap:1.4cqw;padding:1.5cqw 2.2cqw;border-radius:2.2cqw;background:rgba(255,255,255,.055);border:.4cqw solid transparent;font-size:4.1cqw;font-weight:800;text-align:left;width:100%}
.st .si{font-size:4.4cqw}
.st .bar{height:2cqw;border-radius:9cqw;background:rgba(255,255,255,.1);overflow:hidden}
.st .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6b8cff,#b46bff)}
.st .bar i.hi{background:linear-gradient(90deg,#ffb347,#ffe66d)}
.st .bar i.lo{background:linear-gradient(90deg,#5a6a8a,#8494b4)}
.st .sv{font-family:Cinzel,serif;font-size:4.8cqw;text-align:right}
.pick .st{cursor:pointer;border-color:rgba(255,204,77,.45);background:rgba(255,204,77,.08);animation:glowst 1.8s ease-in-out infinite}
.pick .st:active{transform:scale(.97);background:rgba(255,204,77,.3)}
@keyframes glowst{50%{box-shadow:0 0 3cqw rgba(255,204,77,.35)}}
.st.sel{border-color:#ffcc4d;background:rgba(255,204,77,.22)}
.c-flav{font-size:3.3cqw;font-style:italic;color:var(--mut);padding:0 4cqw 3.2cqw;text-align:center;line-height:1.3}
.card.r-rare::after,.card.r-epic::after,.card.r-legendary::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 47%,rgba(255,255,255,.05) 53%,transparent 62%);background-size:300% 100%;animation:shine 5s ease-in-out infinite;mix-blend-mode:overlay}
.card.r-legendary::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:.28;background:linear-gradient(125deg,#ff4d4d,#ffd24d,#4dff88,#4dd2ff,#9b4dff,#ff4dd2,#ff4d4d);background-size:400% 400%;mix-blend-mode:color-dodge;animation:goldflow 8s linear infinite}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}

/* ---------- Scene fx ---------- */
.fx{transform-box:fill-box;animation-iteration-count:infinite;animation-timing-function:linear}
.fx-rise{animation-name:fxrise}
.fx-fall{animation-name:fxfall}
.fx-blink{animation-name:fxblink;animation-timing-function:ease-in-out}
.fx-drift{animation-name:fxdrift}
.fx-rain{animation-name:fxrain}
@keyframes fxrise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(12px,-150px);opacity:0}}
@keyframes fxfall{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-14px,170px);opacity:.2}}
@keyframes fxblink{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(6px,-8px)}}
@keyframes fxdrift{0%{transform:translate(-30px,0);opacity:0}30%,70%{opacity:.8}100%{transform:translate(40px,-10px);opacity:0}}
@keyframes fxrain{0%{transform:translate(0,-40px);opacity:0}20%{opacity:.7}100%{transform:translate(-20px,200px);opacity:0}}
.aur{animation:aur 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes aur{50%{transform:skewX(-12deg) scaleY(1.15);opacity:.55}}
.bolt{animation:bolt 5s steps(1) infinite}
@keyframes bolt{0%,88%,92%,100%{opacity:0}89%,93%{opacity:1}}

/* ---------- Reveal ---------- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs.n1{grid-template-columns:1fr;max-width:240px;margin:0 auto}
.tilew{container-type:inline-size;perspective:600px}
.tile{position:relative;border-radius:6cqw;padding:2.2cqw;background:var(--frame);background-size:300% 300%;transition:transform .5s,opacity .5s,box-shadow .4s;cursor:pointer}
.tile.r-common{--frame:linear-gradient(145deg,#7d8898,#e2e8ef 30%,#5a6474 60%,#c9d1db)}
.tile.r-rare{--frame:linear-gradient(145deg,#1546c2,#8fd0ff 30%,#123a9a 60%,#62adff)}
.tile.r-epic{--frame:linear-gradient(145deg,#4f1696,#e0b0ff 30%,#3a0f78 60%,#bb7cff)}
.tile.r-legendary{--frame:linear-gradient(135deg,#9a6512,#ffe9a0 25%,#c08414 50%,#fff6d6 70%,#b07a10)}
.tile-in{border-radius:4.2cqw;overflow:hidden;background:#140c24}
.t-who{display:flex;align-items:center;gap:2cqw;padding:2.4cqw 3.5cqw;font-weight:900;font-size:7.2cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-art{position:relative;aspect-ratio:3/2;overflow:hidden}
.t-art svg{position:absolute;inset:0;width:100%;height:100%}
.t-art .c-crea{font-size:40cqw}
.t-art .c-acc{font-size:15cqw}
.t-name{font-family:Cinzel,serif;font-weight:800;font-size:6.6cqw;padding:2.4cqw 3.5cqw 0;line-height:1.15;min-height:9cqw}
.t-num{font-family:Cinzel,serif;font-weight:800;font-size:17cqw;text-align:center;line-height:1.1;padding:1cqw 0 0}
.t-notes{font-size:5.6cqw;font-weight:800;text-align:center;color:#ffe08a;padding:0 3cqw 2.4cqw;min-height:8cqw;line-height:1.25}
.t-notes .neg{color:#ff9db0}
.t-out{position:absolute;left:50%;top:-3cqw;transform:translateX(-50%);z-index:3;white-space:nowrap;font-weight:900;font-size:6.4cqw;padding:1.4cqw 4cqw;border-radius:99px;background:#2a1a48;border:.6cqw solid var(--line);transition:opacity .4s}
.tile.win{transform:scale(1.04);box-shadow:0 0 0 1.2cqw #ffcc4d,0 0 14cqw rgba(255,204,77,.75)}
.tile.win .t-out{background:linear-gradient(180deg,#ffd75e,#e09a12);color:#3a2000;border-color:#fff3c4}
.tile.lose{filter:saturate(.45) brightness(.7)}
.tile.lose .t-out{left:auto;right:-2cqw;transform:none}
.tile.mine .t-who{color:#ffe08a}
.tile.phx .t-out{background:#173b5a;color:#bfe8ff}
.rv.anim .tilew:not(.in) .tile{opacity:0;transform:rotateY(80deg) scale(.8)}
.rv.anim:not(.s1) .t-notes>*{opacity:0}
.rv.anim:not(.s2) .t-out,.rv.anim:not(.s2) .headline,.rv.anim:not(.s1) .plog{opacity:0}
.rv.anim:not(.s2) .tile.win{transform:none;box-shadow:none}
.rv.anim:not(.s2) .tile.lose{filter:none}
.t-stat{font-size:5.4cqw;font-weight:800;text-align:center;color:var(--mut);margin-top:-1cqw}
.rv:not(.pre) .announce{display:none}
.rv.pre .vs,.rv.pre .headline,.rv.pre .plog{display:none}
.announce{text-align:center;animation:pop .35s ease-out}
.announce .big{font-family:Cinzel,serif;font-weight:800;font-size:24px;margin:4px 0 12px}
.announce .big .statpill{font-size:24px;padding:6px 16px;margin-top:8px}
.announce .mycard{max-width:300px}
.foot.hold{visibility:hidden}
.btn .cdbar{position:absolute;left:0;bottom:0;height:5px;background:rgba(58,32,0,.45);border-radius:0 0 16px 16px}
.btn.cd{position:relative;overflow:hidden}
.t-num.zap{animation:zap .6s}
@keyframes zap{30%{transform:scale(1.4);color:#ffe66d;text-shadow:0 0 14px #ffcc4d}}
.headline{text-align:center;font-family:Cinzel,serif;font-weight:800;font-size:22px;margin:16px 0 4px;transition:opacity .4s}
.headline.big{font-size:26px;color:#ffe08a;text-shadow:0 0 20px rgba(255,204,77,.6)}
.plog{display:grid;gap:6px;margin-top:10px;transition:opacity .4s}
.plog div{font-size:14px;font-weight:700;padding:8px 12px;border-radius:12px;background:rgba(155,107,255,.15);border:1px solid rgba(155,107,255,.35)}
.statpill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(255,204,77,.18);border:1px solid rgba(255,204,77,.5);color:#ffe08a}
.topsy{display:block;margin:8px auto 0;width:max-content;max-width:100%;padding:6px 14px;border-radius:12px;background:linear-gradient(90deg,#ff4dd2,#9b4dff);color:#fff;font-family:Nunito;font-weight:900;font-size:15px;animation:pulse 1s infinite}

/* ---------- Over ---------- */
.trophy{font-size:90px;text-align:center;animation:pulse 1.5s infinite;filter:drop-shadow(0 0 24px rgba(255,204,77,.7))}
.conf{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:confall linear forwards;z-index:50}
@keyframes confall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Gallery / modal / toast ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
.filters button.on{background:var(--acc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-items:start}
.grid .cardw{cursor:pointer}
#modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:rgba(5,2,12,.82);backdrop-filter:blur(6px)}
#modal.on{display:grid}
#modal .cardw{width:min(92vw,370px);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
#modal .close{margin-top:12px;text-align:center;color:var(--mut);font-weight:800}
.mbox{width:min(92vw,400px)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#2a1a48;border:1px solid var(--acc);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:pop .25s}
.rules h3{margin:16px 0 6px;color:#ffe08a;font-size:17px}
.rules p,.rules li{line-height:1.5;font-size:15px}
.rules ul{padding-left:20px;margin:6px 0}
.pw-list{display:grid;gap:8px}
.pw-list div{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:14px}
.pw-list b{color:#ffe08a}

'use strict';
/* =====================================================================
   DATA: stats, powers, cards
   ===================================================================== */
const STATS = [

  {k:'mag',  n:'Magic',        i:'✨'},
  {k:'int',  n:'Intelligence', i:'🧠'},
  {k:'wit',  n:'Wit',          i:'🎭'},
  {k:'cou',  n:'Courage',      i:'🛡️'},
  {k:'fear', n:'Fear Factor',  i:'😱'},
];
const SN = k => STATS.find(s => s.k === k).n;
const SI = k => STATS.find(s => s.k === k).i;

const RAR = {
  common:    {n:'Common',    c:'#cfd8e3', gem:'●'},

const PICON = {boost:'💥', allboost:'🌈', curse:'☠️', shatter:'🪨', reverse:'🔄', silence:'🔇', shapeshift:'🌀', pack:'🐾', lucky:'🍀', phoenix:'🕊️', steal:'🖐️'};
function powerText(p) {
  switch (p.type) {
    case 'boost':      return `+${p.amt} when ${p.stats.map(SN).join(' or ')} is picked.`;
    case 'allboost':   return `+${p.amt} to whichever stat is picked.`;
    case 'curse':      return `Every other card loses ${p.amt} this round.`;
    case 'shatter':    return `Halves the strongest enemy card's number.`;
    case 'reverse':    return `Topsy-turvy! The LOWEST number wins this round.`;
    case 'silence':    return `Cancels every other card's power this round.`;
    case 'shapeshift': return `Always uses its highest stat, whatever is picked.`;
    case 'pack':       return `Adds half the picked stat of the next card in your deck.`;
    case 'lucky':      return `Wins any tie.`;
    case 'phoenix':    return `If it doesn't win, it flies back to your deck.`;
    case 'steal':      return `If it wins, it also steals a card from the player with the most cards.`;
  }
}

// mk(id, name, emoji, accent, scene, glow, rarity, [str,mag,int,wit,cou,fear], power, flavour, tint)

  const st = {}; STATS.forEach((x, i) => st[x.k] = s[i]);
  return {id, name, e, acc, scene, glow, r, s: st, p, flav, tint: tint || ''};
}

  mk('bonecrusher','Bonecrusher the Mountain Troll','🧌','🪨','cavern','#b0c4de','epic',[98,12,10,18,84,90], pw('lucky','Thick Skull'), 'Can lift a castle. Cannot spell “castle”.'),

  mk('lyra','Lyra the Storm Archer','🧝‍♀️','🏹','storm','#a0e9ff','rare',[50,54,64,70,78,36], pw('boost','Eye of the Storm',{stats:['cou'],amt:15}), 'Her arrows ride the lightning and never miss.'),

  mk('grizelda','Grizelda the Bog Witch','🧙‍♀️','🧪','swamp','#9dff5c','rare',[22,88,82,72,36,78], pw('reverse','Upside-Down Hex'), 'Her soup is 90% frogspawn and 10% mischief.'),
  mk('ironhide','Ironhide the Golem','🗿','⚙️','cavern','#ffb070','rare',[94,24,18,8,99,66], pw('silence','Iron Will'), 'Built to guard the Deep Gate. Has not blinked in 400 years.'),
  mk('kiyo','Kiyo the Nine-Tailed Fox','🦊','🏮','cosmos','#ff9a3c','rare',[30,74,72,86,48,38], pw('pack','Nine Tails',{}), 'Each of her tails holds a different secret.'),
  // ---------- COMMON ----------
  mk('snatch','Snatch the Goblin Thief','👺','🗡️','swamp','#ff8a5c','common',[34,18,40,72,28,46], pw('steal','Sticky Fingers'), 'Whatever you’re holding, he’s already got it.'),
  mk('bertha','Big Bertha the Bog Toad','🐸','💧','swamp','#9dff5c','common',[44,32,22,36,48,38], null, 'Her croak can be heard three valleys away.'),
  mk('pip','Sir Pip the Brave Squire','🤺','🛡️','meadow','#ffd166','common',[46,8,44,56,93,14], null, 'Small sword. Enormous heart.'),
  mk('shriek','The Shriek Swarm','🦇','🌙','castle','#c08bff','common',[26,30,22,48,52,76], null, 'A thousand wings, a thousand squeaks, zero manners.'),

  mk('snapjaw','Snapjaw the Swamp Croc','🐊','💧','swamp','#b6ff7a','common',[82,6,18,24,58,76], null, 'Smiles a lot. That is not a good sign.'),
  mk('grumbold','Grumbold the Frost Yeti','🦍','❄️','ice','#cfefff','common',[84,16,26,26,64,70], null, 'Hates summer, loves snowball fights.', 'grayscale(1) brightness(1.9) sepia(.25) hue-rotate(170deg)'),
  mk('morel','Morel the Mushroom Sprite','🍄','✨','forest','#ff7ac8','common',[10,58,36,62,30,18], pw('curse','Sneezy Spores',{amt:6}), 'Achoo! Everyone nearby is now slightly purple.'),
  mk('nessa','Nessa the Loch Serpent','🦕','🌊','ocean','#66ffd9','common',[82,24,30,20,58,74], null, 'Shy. Very large. Mostly just wants to be left alone.', 'hue-rotate(40deg) saturate(1.3)'),
  mk('cloudmane','Cloudmane the Pegasus','🐎','☁️','storm','#e8f4ff','common',[62,48,44,40,70,20], null, 'Gallops on clouds and lands without a sound.', 'grayscale(1) brightness(1.75)'),
  mk('sandsting','Sandsting the Giant Scorpion','🦂','🌵','desert','#ffb347','common',[56,14,14,28,56,82], null, 'Hides under the dunes, waiting for the clumsy.'),
  mk('midnight','Midnight the Witch’s Cat','🐈‍⬛','🌙','castle','#b46bff','common',[12,54,66,90,36,32], pw('lucky','Nine Lives'), 'Knows every spell, but only does them for treats.'),
  mk('gorgle','Gorgle the Cave Ogre','👹','🍖','cavern','#ff6b6b','common',[88,8,10,14,64,80], null, 'Eats three dinners. Then a fourth, just in case.'),
  mk('silverstag','The Silver Stag','🦌','🌿','forest','#e0f0ff','common',[54,58,50,38,70,16], null, 'Seen only by moonlight, and only by the kind.', 'grayscale(.7) brightness(1.5)'),
  mk('razorfin','Razorfin the Sea Raider','🦈','⚓','ocean','#4dd8ff','common',[78,10,24,30,66,84], null, 'Smells treasure from ten miles away.'),
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));
const AVG = {}; STATS.forEach(s => AVG[s.k] = CARDS.reduce((a, c) => a + c.s[s.k], 0) / CARDS.length);

/* =====================================================================
   ART: procedural scenes
   ===================================================================== */
function rng(seed) { let s = seed >>> 0 || 7; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; }
const f1 = n => n.toFixed(1);

const SC = {
  volcano:  {sky:['#12020a','#5a0d0d','#d2501a'], far:'#3a0b0b', near:'#120303', fx:'ember',   stars:6},
  ice:      {sky:['#030b1f','#0c2a55','#3d7fb8'], far:'#86b4dc', near:'#e6f3ff', fx:'snow',    stars:40},
  forest:   {sky:['#020a08','#0b2b22','#2a6a52'], far:'#0d3326', near:'#03110b', fx:'firefly', stars:30},
  castle:   {sky:['#07031a','#2a0f52','#8a45b0'], far:'#22103f', near:'#0a0418', fx:'mote',    stars:40},
  ocean:    {sky:['#03263d','#04607e','#0aa0c0'], far:'#04384f', near:'#021c29', fx:'bubble',  stars:0},
  storm:    {sky:['#05070f','#1a2238','#4a5a84'], far:'#161d33', near:'#070a13', fx:'rain',    stars:0},
  cosmos:   {sky:['#02010a','#160a38','#3d1878'], far:'#1a0d3d', near:'#0a0520', fx:'twinkle', stars:80},
  swamp:    {sky:['#030a05','#16301c','#56782e'], far:'#173022', near:'#06120a', fx:'firefly', stars:14},
  desert:   {sky:['#2a0d1f','#b04a2a','#f8bd62'], far:'#a2502b', near:'#5a230f', fx:'dust',    stars:0},
  cavern:   {sky:['#03030a','#121530','#2a3866'], far:'#10142c', near:'#05060f', fx:'glint',   stars:0},
  meadow:   {sky:['#2b1460','#c0508f','#ffc27a'], far:'#6a4594', near:'#1f4d2b', fx:'sparkle', stars:10},
  graveyard:{sky:['#020604','#0f2419','#33624a'], far:'#10261b', near:'#040b07', fx:'wisp',    stars:24},
};

function ridge(r, y, amp, step, col, op) {
  let d = `M0 200L0 ${f1(y - r() * amp)}`;
  for (let x = step; x <= 300 + step; x += step) d += `L${x} ${f1(y - r() * amp)}`;
  return `<path d="${d}L300 200Z" fill="${col}" opacity="${op || 1}"/>`;
}
function hills(r, y, amp, step, col, op) {
  let d = `M0 200L0 ${f1(y)}`, px = 0;
  for (let x = step; x <= 300 + step; x += step) { const cy = y - amp * (0.4 + r() * 0.8); d += `Q${f1(px + step / 2)} ${f1(cy)} ${x} ${f1(y - r() * amp * 0.3)}`; px = x; }
  return `<path d="${d}L300 200Z" fill="${col}" opacity="${op || 1}"/>`;
}
function pine(x, y, h, col) {
  const w = h * 0.42;
  return `<path d="M${f1(x)} ${f1(y - h)}L${f1(x + w * .35)} ${f1(y - h * .62)}L${f1(x + w * .18)} ${f1(y - h * .62)}L${f1(x + w * .55)} ${f1(y - h * .3)}L${f1(x + w * .3)} ${f1(y - h * .3)}L${f1(x + w * .7)} ${f1(y - h * .08)}L${f1(x + w * .08)} ${f1(y - h * .08)}L${f1(x + w * .08)} ${f1(y)}L${f1(x - w * .08)} ${f1(y)}L${f1(x - w * .08)} ${f1(y - h * .08)}L${f1(x - w * .7)} ${f1(y - h * .08)}L${f1(x - w * .3)} ${f1(y - h * .3)}L${f1(x - w * .55)} ${f1(y - h * .3)}L${f1(x - w * .18)} ${f1(y - h * .62)}L${f1(x - w * .35)} ${f1(y - h * .62)}Z" fill="${col}"/>`;
}
function pines(r, y, n, col, hmin, hmax) { let s = ''; for (let i = 0; i < n; i++) { const x = (i + r() * .8) * (300 / n); s += pine(x, y + r() * 6, hmin + r() * (hmax - hmin), col); } return s; }
function tower(x, y, w, h, col, roof, lit) {
  let s = `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" fill="${col}"/>`;
  if (roof) s += `<path d="M${x - 3} ${y - h}L${x + w / 2} ${y - h - w * 1.5}L${x + w + 3} ${y - h}Z" fill="${col}"/>`;
  else for (let i = 0; i < 4; i++) s += `<rect x="${f1(x + i * w / 3.5)}" y="${y - h - 5}" width="${f1(w / 7)}" height="6" fill="${col}"/>`;
  if (lit) s += `<rect x="${f1(x + w / 2 - 2)}" y="${f1(y - h * .7)}" width="4" height="7" rx="2" fill="#ffd36b" opacity=".9"/>`;
  return s;
}
function deadTree(x, y, h, col, r) {
  let s = `<path d="M${x} ${y}L${x + 2} ${y - h}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`;
  for (let i = 0; i < 5; i++) {
    const by = y - h * (0.35 + r() * 0.6), dir = r() < .5 ? -1 : 1, len = 10 + r() * 18;
    s += `<path d="M${x + 1} ${f1(by)}q${f1(dir * len * .5)} ${f1(-len * .2)} ${f1(dir * len)} ${f1(-len * .6)}" stroke="${col}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return s;
}
function grave(x, y, col, cross) {
  return cross
    ? `<path d="M${x - 2} ${y}V${y - 26}H${x - 9}V${y - 31}H${x - 2}V${y - 38}H${x + 2}V${y - 31}H${x + 9}V${y - 26}H${x + 2}V${y}Z" fill="${col}"/>`
    : `<path d="M${x - 9} ${y}V${y - 20}a9 9 0 0 1 18 0V${y}Z" fill="${col}"/>`;
}
function particles(kind, r, glow) {
  let s = '', n = {ember:14, snow:22, firefly:12, mote:12, bubble:12, rain:24, twinkle:18, dust:10, glint:12, sparkle:14, wisp:7}[kind];
  for (let i = 0; i < n; i++) {
    const x = r() * 300, y = r() * 200, d = (r() * 6).toFixed(2), dur = (3 + r() * 4).toFixed(2), st = `style="animation-delay:-${d}s;animation-duration:${dur}s"`;
    switch (kind) {
      case 'ember':   s += `<circle class="fx fx-rise" ${st} cx="${f1(x)}" cy="${f1(150 + r() * 50)}" r="${f1(.8 + r() * 1.6)}" fill="${r() < .5 ? '#ffb347' : '#ff5a1a'}"/>`; break;
      case 'snow':    s += `<circle class="fx fx-fall" ${st} cx="${f1(x)}" cy="${f1(-10 + r() * 40)}" r="${f1(.7 + r() * 1.5)}" fill="#fff" opacity=".9"/>`; break;
      case 'firefly': s += `<circle class="fx fx-blink" ${st} cx="${f1(x)}" cy="${f1(80 + r() * 110)}" r="${f1(1 + r() * 1.2)}" fill="${glow === '#b46bff' ? '#d9b3ff' : '#e9ff7a'}"/>`; break;
      case 'mote':    s += `<circle class="fx fx-rise" ${st} cx="${f1(x)}" cy="${f1(160 + r() * 40)}" r="${f1(.6 + r())}" fill="#e6c8ff"/>`; break;
      case 'bubble':  s += `<circle class="fx fx-rise" ${st} cx="${f1(x)}" cy="${f1(170 + r() * 30)}" r="${f1(1.2 + r() * 2.8)}" fill="none" stroke="#c8f6ff" stroke-width=".8" opacity=".8"/>`; break;
      case 'rain':    s += `<line class="fx fx-rain" style="animation-delay:-${d}s;animation-duration:${(0.8 + r() * .6).toFixed(2)}s" x1="${f1(x)}" y1="0" x2="${f1(x - 4)}" y2="12" stroke="#a8c4ff" stroke-width=".8" opacity=".6"/>`; break;
      case 'twinkle': s += `<circle class="fx fx-blink" ${st} cx="${f1(x)}" cy="${f1(y)}" r="${f1(.8 + r() * 1.4)}" fill="#fff"/>`; break;
      case 'dust':    s += `<circle class="fx fx-drift" ${st} cx="${f1(x)}" cy="${f1(130 + r() * 60)}" r="${f1(.8 + r())}" fill="#ffe2a8"/>`; break;
      case 'glint':   s += `<path class="fx fx-blink" ${st} d="M${f1(x)} ${f1(y - 3)}l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#bff7ff"/>`; break;
      case 'sparkle': s += `<path class="fx fx-rise" ${st} d="M${f1(x)} ${f1(150 + r() * 50)}l1.2 2.4 2.4 1.2-2.4 1.2-1.2 2.4-1.2-2.4-2.4-1.2 2.4-1.2z" fill="#fff6c4"/>`; break;
      case 'wisp':    s += `<ellipse class="fx fx-drift" ${st} cx="${f1(x)}" cy="${f1(120 + r() * 60)}" rx="${f1(14 + r() * 20)}" ry="3" fill="#bfffd8" opacity=".35"/>`; break;
    }
  }
  return s;
}

const SCENE_CACHE = {};
function sceneSVG(card) {
  if (SCENE_CACHE[card.id]) return SCENE_CACHE[card.id];
  const S = SC[card.scene], r = rng(hash(card.id)), id = 'sc_' + card.id, glow = card.glow;
  let defs = `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.sky[0]}"/><stop offset=".6" stop-color="${S.sky[1]}"/><stop offset="1" stop-color="${S.sky[2]}"/></linearGradient>
  <radialGradient id="${id}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${glow}" stop-opacity=".9"/><stop offset=".45" stop-color="${glow}" stop-opacity=".35"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient>
  <radialGradient id="${id}m" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>`;

/* =====================================================================
   GAME ENGINE (runs on the host's phone only)
   ===================================================================== */
const MODES = {
  quick: {n:'Quick Battle', d:'15 rounds, most cards wins', rounds:15},
  std:   {n:'Standard',     d:'30 rounds, most cards wins', rounds:30},
  epic:  {n:'Epic Quest',   d:'Until one player owns every card', rounds:0},
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function newGame(seats, mode) {
  const deck = shuffle(CARDS.map(c => c.id)), n = seats.length, per = Math.floor(deck.length / n);
  return {
    phase: 'choose', round: 1, mode,
    players: seats.map((p, i) => ({pid: p.pid, name: p.name, av: p.av, bot: !!p.bot, deck: deck.slice(i * per, (i + 1) * per)})),
    pot: deck.slice(per * n),
    chooser: seats[Math.floor(Math.random() * n)].pid,
    result: null, ready: [], standings: null,
  };
}

function resolveRound(g, stat) {
  const byPid = pid => g.players.find(p => p.pid === pid);
  const plays = g.players.filter(p => p.deck.length).map(p => ({pid: p.pid, id: p.deck.shift(), notes: []}));
  const C = pl => CARD[pl.id], nm = pl => byPid(pl.pid).name;
  const log = [];
  const silencers = plays.filter(pl => C(pl).p && C(pl).p.type === 'silence');
  plays.forEach(pl => { const p = C(pl).p; pl.on = !!p && (!silencers.length || p.type === 'silence'); });
  silencers.forEach(pl => log.push(`🔇 ${nm(pl)}'s ${C(pl).name} used ${C(pl).p.name}: all other powers are cancelled!`));
  const has = (pl, t) => pl.on && C(pl).p.type === t;

  plays.forEach(pl => {
    const c = C(pl); pl.base = c.s[stat]; pl.val = pl.base;
    if (has(pl, 'shapeshift')) {
      const best = STATS.reduce((a, s) => c.s[s.k] > c.s[a] ? s.k : a, stat);
      if (best !== stat) { pl.val = c.s[best]; pl.notes.push(`🌀 uses ${SN(best)}`); log.push(`🌀 ${c.name} shapeshifts and uses ${SN(best)} (${c.s[best]}) instead!`); }
    }
  });
  plays.forEach(pl => {
    const c = C(pl), p = c.p;
    if (has(pl, 'boost') && p.stats.includes(stat)) { pl.val += p.amt; pl.notes.push(`💥 +${p.amt}`); log.push(`💥 ${c.name}'s ${p.name} adds +${p.amt}!`); }
    if (has(pl, 'allboost')) { pl.val += p.amt; pl.notes.push(`🌈 +${p.amt}`); log.push(`🌈 ${c.name}'s ${p.name} adds +${p.amt}!`); }
    if (has(pl, 'pack')) {
      const next = byPid(pl.pid).deck[0];
      if (next) { const add = Math.floor(CARD[next].s[stat] / 2); pl.val += add; pl.notes.push(`🐾 +${add}`); log.push(`🐾 ${c.name} calls ${CARD[next].name} for help: +${add}!`); }
    }
  });
  plays.forEach(pl => {
    if (!has(pl, 'curse')) return;
    const amt = C(pl).p.amt;
    plays.forEach(o => { if (o !== pl) { o.val = Math.max(0, o.val - amt); o.notes.push(`<span class="neg">☠️ −${amt}</span>`); } });
    log.push(`☠️ ${C(pl).name}'s ${C(pl).p.name}: every other card loses ${amt}!`);
  });
  plays.forEach(pl => {
    if (!has(pl, 'shatter')) return;
    const opp = plays.filter(o => o !== pl).sort((a, b) => b.val - a.val)[0];
    if (!opp) return;
    const was = opp.val; opp.val = Math.floor(opp.val / 2);
    opp.notes.push(`<span class="neg">🪨 halved</span>`);
    log.push(`🪨 ${C(pl).name}'s ${C(pl).p.name} halves ${C(opp).name} from ${was} to ${opp.val}!`);
  });
  const reversers = plays.filter(pl => has(pl, 'reverse'));
  const low = reversers.length % 2 === 1;
  reversers.forEach(pl => log.push(`🔄 ${C(pl).name} casts ${C(pl).p.name}!`));
  if (reversers.length > 1) log.push(`🔄 Two topsy-turvy spells cancel out. Highest wins after all!`);

  const best = low ? Math.min(...plays.map(p => p.val)) : Math.max(...plays.map(p => p.val));
  const tied = plays.filter(p => p.val === best);
  let win = null;
  if (tied.length === 1) win = tied[0];
  else {
    const lucky = tied.filter(p => has(p, 'lucky'));
    if (lucky.length === 1) { win = lucky[0]; log.push(`🍀 It was a tie, but ${C(win).name}'s ${C(win).p.name} breaks it!`); }
  }

  const spoils = [];
  plays.forEach(pl => {
    if (pl === win) return;
    if (has(pl, 'phoenix')) { byPid(pl.pid).deck.push(pl.id); pl.out = 'phoenix'; log.push(`🕊️ ${C(pl).name} escapes back to ${nm(pl)}'s deck!`); }
    else { spoils.push(pl.id); pl.out = win ? 'lose' : 'tie'; }
  });
  let won = 0, stolen = null, toPot = 0;
  if (win) {
    const w = byPid(win.pid);
    won = 1 + spoils.length + g.pot.length;
    w.deck.push(win.id, ...spoils, ...g.pot); g.pot = [];
    win.out = 'win';
    if (has(win, 'steal')) {
      const rival = g.players.filter(p => p !== w && p.deck.length).sort((a, b) => b.deck.length - a.deck.length)[0];
      if (rival) { const cid = rival.deck.shift(); w.deck.push(cid); stolen = {from: rival.pid, id: cid}; log.push(`🖐️ ${C(win).name} also steals ${CARD[cid].name} from ${rival.name}!`); }
    }
    g.chooser = win.pid;
  } else {
    g.pot.push(...spoils); toPot = spoils.length;
  }
  const alive = g.players.filter(p => p.deck.length);
  if (!byPid(g.chooser).deck.length) {
    const seat = g.players.findIndex(p => p.pid === g.chooser);
    for (let k = 1; k <= g.players.length; k++) { const p = g.players[(seat + k) % g.players.length]; if (p.deck.length) { g.chooser = p.pid; break; } }
  }
  g.result = {round: g.round, stat, by: g._choosing, plays: plays.map(p => ({pid: p.pid, id: p.id, base: p.base, val: p.val, notes: p.notes, out: p.out})), log, win: win ? win.pid : null, low, won, toPot, stolen, pot: g.pot.length};
  g.phase = 'reveal';
  g.ready = [];
  g.over = alive.length <= 1 || (MODES[g.mode].rounds && g.round >= MODES[g.mode].rounds) || g.round >= 250;
  return g.result;
}

// Reveal pacing, shared by the host (to time the next round) and every phone (to animate).
const ANNOUNCE_MS = 2000, COUNTDOWN_MS = 2000;
function revealTiming(R) {
  let shown = ANNOUNCE_MS + 250 + R.plays.length * 420 + 450;
  if (R.log.length) shown += 1100;
  return {shown, next: shown + COUNTDOWN_MS + (R.log.length ? 2000 : 0)};
}

function botPick(cardId) {
  const c = CARD[cardId], p = c.p;
  let best = null, bv = -1e9;
  STATS.forEach(s => {
    let v = c.s[s.k] - AVG[s.k];
    if (p && p.type === 'reverse') v = -v;
    if (p && p.type === 'boost' && p.stats.includes(s.k)) v += p.amt;
    v += Math.random() * 14;
    if (v > bv) { bv = v; best = s.k; }
  });
  return best;
}

/* =====================================================================
   HOST: owns the game, talks to the other phones
   ===================================================================== */
const PREFIX = 'mythictrumps-v1-';
const BOTS = [['Sir Botalot','🤖'],['Grumblebot','👾'],['Cogwizard','🛸'],['Robo-Rex','🦖'],['Pixelpip','🎮']];
let HOST = null;   // {code, peer, conns:Map, me, seats:[], mode, g, timers}
let CLIENT = null; // {code, peer, conn, joined, leaving}
const UI = {screen:'home', view:null, filter:'all', key:'', animRound:0, offline:false};

function hostStart(online) {
  HOST = {code: null, peer: null, conns: new Map(), me: ME.pid, seats: [{pid: ME.pid, name: ME.name, av: ME.av}], mode: 'std', g: null, timers: {}, online};
  if (!online) { addBot(); addBot(); addBot(); }
  UI.screen = 'game';
  pushState();
}
function addBot() {
  if (HOST.seats.length >= 6) return;
  const used = HOST.seats.filter(s => s.bot).map(s => s.name);
  const b = BOTS.find(b => !used.includes(b[0]));
  HOST.seats.push({pid: 'bot-' + Math.random().toString(36).slice(2, 8), name: b[0], av: b[1], bot: true});
}
function isOn(pid) {
  if (!HOST) return true;
  if (pid === HOST.me) return true;
  const s = (HOST.g ? HOST.g.players : HOST.seats).find(p => p.pid === pid);
  if (s && s.bot) return true;
  const c = HOST.conns.get(pid); return !!(c && c.open);
}
function viewFor(pid) {
  const H = HOST, g = H.g;
  if (!g) return {phase: 'lobby', code: H.code, online: H.online, host: H.me, mode: H.mode, players: H.seats.map(s => ({pid: s.pid, name: s.name, av: s.av, bot: !!s.bot, on: isOn(s.pid)}))};
  const me = g.players.find(p => p.pid === pid);
  return {
    phase: g.phase, code: H.code, online: H.online, host: H.me, mode: g.mode, round: g.round, chooser: g.chooser, pot: g.pot.length,
    players: g.players.map(p => ({pid: p.pid, name: p.name, av: p.av, bot: p.bot, count: p.deck.length, on: isOn(p.pid)})),
    top: me && me.deck.length ? me.deck[0] : null,
    result: g.result, ready: g.ready, need: needReady(), standings: g.standings, over: !!g.over,
  };
}
function needReady() {
  const g = HOST.g;
  return g.players.filter(p => !p.bot && p.deck.length && isOn(p.pid)).map(p => p.pid);
}
function pushState() {
  if (!HOST) return;
  HOST.conns.forEach((conn, pid) => { if (conn.open) try { conn.send({t: 'state', v: viewFor(pid)}); } catch (e) {} });
  UI.view = viewFor(HOST.me);
  render();
  scheduleHost();
}
function clearHostTimers() { Object.values(HOST.timers).forEach(clearTimeout); HOST.timers = {}; }
function scheduleHost() {
  const g = HOST.g; clearHostTimers();
  if (!g) return;
  if (g.phase === 'choose') {
    const ch = g.players.find(p => p.pid === g.chooser);
    if (ch.bot || !isOn(ch.pid)) HOST.timers.bot = setTimeout(() => doChoose(ch.pid, botPick(ch.deck[0]), true), ch.bot ? 1400 + Math.random() * 1200 : 6000);
  } else if (g.phase === 'reveal') {
    const need = needReady();
    const left = need.filter(p => !g.ready.includes(p));
    const wait = g.revealAt + revealTiming(g.result).next + 400 - Date.now();
    HOST.timers.adv = setTimeout(advance, need.length && !left.length ? 300 : Math.max(300, wait));
  }
}
function doChoose(pid, stat, auto) {
  const g = HOST.g;
  if (!g || g.phase !== 'choose' || g.chooser !== pid || !STATS.some(s => s.k === stat)) return;
  g._choosing = pid;
  resolveRound(g, stat);
  g.revealAt = Date.now();
  pushState();
}
function advance() {
  const g = HOST.g; if (!g || g.phase !== 'reveal') return;
  if (g.over) {
    g.phase = 'over';
    g.standings = g.players.map(p => ({pid: p.pid, name: p.name, av: p.av, count: p.deck.length})).sort((a, b) => b.count - a.count);
  } else { g.round++; g.phase = 'choose'; }
  pushState();
}
function hostAction(pid, m) {
  const H = HOST, g = H.g, isHost = pid === H.me;
  switch (m.t) {
    case 'choose': doChoose(pid, m.stat); break;
    case 'ready':
      if (g && g.phase === 'reveal' && !g.ready.includes(pid)) { g.ready.push(pid); pushState(); }
      break;
    case 'addBot': if (isHost && !g) { addBot(); pushState(); } break;
    case 'kick':
      if (isHost && !g && m.pid !== H.me) {
        H.seats = H.seats.filter(s => s.pid !== m.pid);
        const c = H.conns.get(m.pid); if (c) { try { c.send({t: 'kicked'}); } catch (e) {} H.conns.delete(m.pid); setTimeout(() => c.close(), 300); }
        pushState();
      }
      break;
    case 'mode': if (isHost && !g && MODES[m.mode]) { H.mode = m.mode; pushState(); } break;
    case 'start':
      if (isHost && !g && H.seats.length >= 2) { H.g = newGame(H.seats, H.mode); pushState(); }
      break;
    case 'again':
      if (isHost && g && g.phase === 'over') { H.g = null; H.seats = H.seats.filter(s => isOn(s.pid)); pushState(); }
      break;

}

function makeCode() { const L = 'ABCDEFGHJKMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += L[Math.floor(Math.random() * L.length)]; return s; }

async function hostOnline() {
  try { await loadPeer(); } catch (e) { return toast('Could not load the connection helper. Check your internet.'); }
  hostStart(true);
  const tryOpen = attempt => {
    const code = makeCode();
    const peer = new Peer(PREFIX + code, {debug: 0});
    HOST.peer = peer;
    peer.on('open', () => { HOST.code = code; pushState(); keepAwake(); });
    peer.on('error', e => {
      if (e.type === 'unavailable-id' && attempt < 5) { peer.destroy(); tryOpen(attempt + 1); }
      else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') toast('Connection trouble. Retrying…');
      else if (e.type !== 'peer-unavailable') toast('Connection error: ' + e.type);
    });
    peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('connection', conn => {
      conn.on('data', d => onHostData(conn, d));
      conn.on('close', () => { if (conn.pid && HOST && HOST.conns.get(conn.pid) === conn) { HOST.conns.delete(conn.pid); if (!HOST.g) HOST.seats = HOST.seats.filter(s => s.pid !== conn.pid); pushState(); } });
      conn.on('error', () => {});
    });
  };
  tryOpen(0);
}
function onHostData(conn, d) {
  if (!HOST || !d || typeof d !== 'object') return;
  if (d.t === 'join') {
    const pid = String(d.pid || '').slice(0, 40), name = String(d.name || 'Player').slice(0, 14), av = String(d.av || '🙂').slice(0, 8);
    if (!pid) return;
    const g = HOST.g;
    const known = g ? g.players.find(p => p.pid === pid) : HOST.seats.find(s => s.pid === pid);
    if (!known) {
      if (g) { conn.send({t: 'error', msg: 'That game has already started. Ask the host to start a new one.'}); return; }
      if (HOST.seats.length >= 6) { conn.send({t: 'error', msg: 'That game is full (6 players max).'}); return; }
      HOST.seats.push({pid, name, av});
    } else if (!g) { known.name = name; known.av = av; }
    const old = HOST.conns.get(pid); if (old && old !== conn) try { old.close(); } catch (e) {}
    conn.pid = pid; HOST.conns.set(pid, conn);
    pushState();
    return;
  }
  if (conn.pid) hostAction(conn.pid, d);
}

/* =====================================================================
   CLIENT: a player on another phone
   ===================================================================== */
async function joinGame(code) {
  code = code.toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) return toast('The game code has 4 letters.');
  try { await loadPeer(); } catch (e) { return toast('Could not load the connection helper. Check your internet.'); }
  closeModal();
  CLIENT = {code, peer: null, conn: null, joined: false, leaving: false, tries: 0};
  UI.screen = 'connecting'; render();
  const peer = new Peer({debug: 0});
  CLIENT.peer = peer;
  peer.on('open', () => connectToHost());
  peer.on('error', e => {
    if (!CLIENT || CLIENT.peer !== peer) return;
    if (e.type === 'peer-unavailable') {
      if (!CLIENT.joined) { toast(`No game found with code ${code}. Check the letters!`); leaveGame(); }
      else retryClient();
    } else if (!CLIENT.joined && ['network', 'server-error', 'socket-error', 'browser-incompatible'].includes(e.type)) { toast('Could not connect. Check your internet and try again.'); leaveGame(); }
  });
  peer.on('disconnected', () => { if (CLIENT && !CLIENT.leaving && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
}
function connectToHost() {
  if (!CLIENT || CLIENT.leaving) return;
  const conn = CLIENT.peer.connect(PREFIX + CLIENT.code, {reliable: true});
  CLIENT.conn = conn;
  conn.on('open', () => { CLIENT.tries = 0; conn.send({t: 'join', pid: ME.pid, name: ME.name, av: ME.av}); });
  conn.on('data', d => {
    if (!CLIENT || conn !== CLIENT.conn) return;
    if (d.t === 'state') { CLIENT.joined = true; UI.offline = false; UI.view = d.v; UI.screen = 'game'; render(); keepAwake(); }
    else if (d.t === 'error') { toast(d.msg); leaveGame(); }
    else if (d.t === 'kicked') { toast('The host removed you from the game.'); leaveGame(); }
  });
  conn.on('close', () => { if (CLIENT && conn === CLIENT.conn && !CLIENT.leaving) retryClient(); });
  conn.on('error', () => {});
}
function retryClient() {
  if (!CLIENT || CLIENT.leaving || CLIENT.retrying) return;
  UI.offline = true; render();
  CLIENT.retrying = true;
  setTimeout(() => {
    if (!CLIENT) return;
    CLIENT.retrying = false; CLIENT.tries++;
    if (CLIENT.peer.disconnected && !CLIENT.peer.destroyed) try { CLIENT.peer.reconnect(); } catch (e) {}
    connectToHost();
  }, Math.min(2000 + CLIENT.tries * 1000, 6000));
}
function send(m) {
  if (HOST) hostAction(HOST.me, m);
  else if (CLIENT && CLIENT.conn && CLIENT.conn.open) CLIENT.conn.send(m);
  else toast('Not connected right now. Reconnecting…');
}
function leaveGame() {
  if (HOST) { clearHostTimers(); if (HOST.peer) try { HOST.peer.destroy(); } catch (e) {} HOST = null; }
  if (CLIENT) { CLIENT.leaving = true; try { CLIENT.peer && CLIENT.peer.destroy(); } catch (e) {} CLIENT = null; }
  UI.screen = 'home'; UI.view = null; UI.offline = false; UI.key = '';
  render();
}

function loadPeer() {
  if (window.Peer) return Promise.resolve();
  const urls = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = () => window.Peer ? res() : rej(); s.onerror = rej; document.head.appendChild(s); })), Promise.reject());
}
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;

});

const SFX = {
  ctx: null, on: store('mt_sound') !== 'off',
  init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t, d, type, v) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t;
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, s);
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(v || .18, s + .02); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .05);
  },
  flip() { this.tone(520, 0, .08, 'square', .05); this.tone(780, .04, .08, 'square', .04); },
  power() { [880, 1175, 1568, 2093].forEach((f, i) => this.tone(f, i * .06, .25, 'sine', .1)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .12, .35, 'triangle', .2)); this.tone(1047, .5, .7, 'triangle', .16); },
  lose() { [392, 330, 262].forEach((f, i) => this.tone(f, i * .16, .35, 'sawtooth', .07)); },
  tie() { this.tone(440, 0, .25, 'triangle', .15); this.tone(440, .3, .25, 'triangle', .15); },
  turn() { this.tone(660, 0, .15, 'triangle', .15); this.tone(990, .12, .3, 'triangle', .15); },
  fanfare() { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .14, .3, 'triangle', .2)); },
};

      : `<div class="wait">${v.need.includes(ME.pid) ? '✅ Ready! ' : ''}<span class="dots">${next} coming</span> <span class="cdtxt"></span></div>`;
  }
  if (v.phase === 'over') {
    const amHost = HOST && v.host === ME.pid;
    return `<div class="stack">${amHost ? `<button class="btn gold" data-act="again">🔁 Play again</button>` : `<div class="wait">The host can start another game.</div>`}<button class="btn ghost" data-act="leave">🏠 Home</button></div>`;
  }
  return '';
}
function overHTML(v) {
  const st = v.standings, top = st[0].count, winners = st.filter(s => s.count === top);
  const iWon = winners.some(w => w.pid === ME.pid);
  const title = winners.length > 1 ? `It's a draw between ${winners.map(w => w.pid === ME.pid ? 'you' : esc(w.name)).join(' & ')}!` : iWon ? 'You are the Champion!' : `${esc(winners[0].name)} is the Champion!`;
  return `<div class="trophy">${iWon ? '🏆' : '👑'}</div><div class="banner" style="font-size:24px;color:#ffe08a">${title}</div>
    <div class="panel"><div class="plist">${st.map((s, i) => `<div class="pl"><span style="font-family:Cinzel;font-weight:800;width:22px">${i + 1}</span><span class="a">${s.av}</span><span class="grow">${s.pid === ME.pid ? 'You' : esc(s.name)}</span><span style="font-family:Cinzel;font-weight:800;color:var(--gold)">${s.count} cards</span></div>`).join('')}</div></div>`;
}

function runReveal(v) {
  const R = v.result, rv = $('#rv');
  if (!rv || UI.animRound === R.round) return;
  UI.animRound = R.round;
  rv.classList.add('anim', 'pre');
  const foot = $('#foot'); if (foot) foot.classList.add('hold');
  const T = revealTiming(R);
  if (R.by !== ME.pid) SFX.turn();
  const banner = $('#rvbanner'); if (banner) banner.style.display = 'none';
  later(() => { rv.classList.remove('pre'); if (banner) banner.style.display = ''; }, ANNOUNCE_MS);
  const tiles = [...rv.querySelectorAll('.tilew')];
  const count = (el, from, to, ms) => { const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / ms); el.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
  tiles.forEach(t => { const n = t.querySelector('.t-num'); n.textContent = '0'; });
  tiles.forEach((t, i) => later(() => { t.classList.add('in'); SFX.flip(); const n = t.querySelector('.t-num'); count(n, 0, +n.dataset.base, 550); }, ANNOUNCE_MS + 250 + i * 420));
  let tt = ANNOUNCE_MS + 250 + tiles.length * 420 + 450;
  const mods = R.log.length > 0;
  if (mods) {
    later(() => {
      rv.classList.add('s1'); SFX.power();
      tiles.forEach(t => { const n = t.querySelector('.t-num'); if (n.dataset.base !== n.dataset.val) { n.classList.add('zap'); count(n, +n.dataset.base, +n.dataset.val, 500); } });
    }, tt);
    tt += 1100;
  } else rv.classList.add('s1');
  later(() => {
    rv.classList.add('s2');
    if (foot) foot.classList.remove('hold');
    UI.cdStart = Date.now(); UI.cdEnd = UI.cdStart + (T.next - T.shown);
    tickCountdown(); UI.cdTimer = setInterval(tickCountdown, 100);
    if (!R.win) SFX.tie(); else if (R.win === ME.pid) { SFX.win(); vibrate([60, 40, 120]); confetti(18); } else SFX.lose();
  }, tt);
}
function tickCountdown() {
  if (!UI.cdEnd) return;
  const left = Math.max(0, UI.cdEnd - Date.now()), frac = left / (UI.cdEnd - UI.cdStart);
  document.querySelectorAll('.cdtxt').forEach(e => e.textContent = left ? Math.ceil(left / 1000) : '');
  document.querySelectorAll('.cdbar').forEach(e => e.style.width = (frac * 100) + '%');
  if (!left) { clearInterval(UI.cdTimer); UI.cdEnd = 0; }
}
function confetti(n) {
  const bits = ['✨', '⭐', '🌟', '💎', '🪙', '🎉'];
  for (let i = 0; i < (n || 40); i++) {
    const d = document.createElement('div'); d.className = 'conf'; d.textContent = bits[i % bits.length];
    d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (2.2 + Math.random() * 2.5) + 's'; d.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 6000);
  }
}

function galleryHTML() {
  const f = UI.filter, list = CARDS.filter(c => f === 'all' || (f === 'power' ? c.p : c.r === f));
  const counts = r => CARDS.filter(c => c.r === r).length;
  return `<div class="topbar"><button class="iconbtn" data-act="leave" aria-label="Back">←</button><h2 class="grow">All ${CARDS.length} cards</h2></div>
  <div class="filters">${[['all', 'All'], ['legendary', `★ Legendary (${counts('legendary')})`], ['epic', `✦ Epic (${counts('epic')})`], ['rare', `◆ Rare (${counts('rare')})`], ['common', `● Common (${counts('common')})`], ['power', '💥 Powers']].map(([k, n]) => `<button class="${f === k ? 'on' : ''}" data-act="filter" data-f="${k}">${n}</button>`).join('')}</div>
  <div class="grid">${list.map(c => cardHTML(c.id, {zoom: true})).join('')}</div>`;
}
function rulesHTML() {
  const ex = {};
  CARDS.forEach(c => { if (c.p && !ex[c.p.type]) ex[c.p.type] = c; });
  return `<div class="topbar"><button class="iconbtn" data-act="leave" aria-label="Back">←</button><h2 class="grow">How to play</h2></div>
  <div class="panel rules">
    <h3>🎯 The goal</h3><p>Win cards from the other players. In <b>Quick</b> and <b>Standard</b> games, whoever has the most cards at the end wins. In an <b>Epic Quest</b>, keep going until one player has every card.</p>
    <h3>📱 Getting started</h3><ul><li>One player taps <b>Host a game</b> and gets a 4-letter code. The host must keep their screen open.</li><li>Everyone else taps <b>Join a game</b> on their own phone and types the code.</li><li>Not enough players? The host can add computer players.</li></ul>
    <h3>⚔️ Each round</h3><ul><li>All ${CARDS.length} cards are shuffled and shared out. You can only see the card on top of your deck.</li><li>The player with the 👑 picks a stat: Strength, Magic, Intelligence, Wit, Courage or Fear Factor.</li><li>Everyone's top card is revealed. The highest number wins every card played!</li><li>The winner picks the stat next round.</li><li><b>Tie?</b> The cards go into the pot, and the next winner takes the lot.</li></ul>
    <h3>💎 Rarity</h3><p>● Common, ◆ Rare, ✦ Epic and ★ Legendary. Rarer cards are usually stronger, but every card has a weak spot!</p>
    <h3>💥 Special powers</h3><p>Some cards have powers that switch on automatically when they're played:</p>
    <div class="pw-list">${Object.keys(PICON).map(t => ex[t] ? `<div><b>${PICON[t]} ${esc(ex[t].p.name)}</b> (${esc(ex[t].name)}): ${powerText(ex[t].p)}</div>` : '').join('')}</div>
    <h3>🧠 Top tip</h3><p>If <b>your</b> card has a Topsy-Turvy power, pick its <b>lowest</b> stat!</p>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  SFX.init();
  const el = e.target.closest('[data-act]');
  if (e.target.id === 'modal' || (e.target.closest('#modal') && !el)) { closeModal(); return; }
  if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'av': ME.av = el.dataset.av; store('mt_av', ME.av); document.querySelectorAll('.av').forEach(b => b.classList.toggle('on', b.dataset.av === ME.av)); break;
    case 'host': if (needName()) hostOnline(); break;
    case 'solo': if (needName()) hostStart(false); break;
    case 'join': {
      if (!needName()) break;
      const pre = (new URLSearchParams(location.search).get('join') || '').toUpperCase().slice(0, 4);
      openModal(`<div class="mbox panel stack" style="background:#1b1033"><h2 class="center">🗝️ Join a game</h2><div class="mut center">Type the 4-letter code from the host's screen.</div>
        <input class="txt center" id="code" maxlength="4" value="${esc(pre)}" placeholder="ABCD" autocomplete="off" autocapitalize="characters" style="font-size:32px;letter-spacing:10px;font-family:Cinzel">
        <button class="btn gold" data-act="dojoin">Join!</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
      setTimeout(() => $('#code') && $('#code').focus(), 50);
      break;
    }
    case 'dojoin': joinGame($('#code').value); break;
    case 'close': closeModal(); break;
    case 'gallery': UI.screen = 'gallery'; render(); window.scrollTo(0, 0); break;
    case 'rules': UI.screen = 'rules'; render(); window.scrollTo(0, 0); break;
    case 'filter': UI.filter = el.dataset.f; render(); break;
    case 'zoom': openModal(cardHTML(el.dataset.card) + '<div class="close">Tap anywhere to close</div>'); break;
    case 'sound': SFX.on = !SFX.on; store('mt_sound', SFX.on ? 'on' : 'off'); el.textContent = SFX.on ? '🔊' : '🔇'; break;
    case 'choose':
      if (UI.view && UI.view.phase === 'choose' && UI.view.chooser === ME.pid) {
        el.classList.add('sel'); document.querySelectorAll('.pick').forEach(p => p.classList.remove('pick'));
        send({t: 'choose', stat: el.dataset.stat});
      }
      break;
    case 'ready': el.disabled = true; send({t: 'ready'}); break;
    case 'addBot': send({t: 'addBot'}); break;
    case 'kick': send({t: 'kick', pid: el.dataset.pid}); break;
    case 'start': send({t: 'start'}); break;
    case 'again': send({t: 'again'}); break;
    case 'share': navigator.share({title: 'Card Battler', text: 'Join my Card Battler game! Code: ' + UI.view.code, url: el.dataset.url}).catch(() => {}); break;
    case 'quit':
      if (HOST && HOST.online && (HOST.g || HOST.seats.length > 1)) { if (!confirm('You are the host. Leaving ends the game for everyone. Leave?')) break; }
      else if (CLIENT && UI.view && UI.view.phase !== 'lobby' && UI.view.phase !== 'over') { if (!confirm('Leave this game?')) break; }
      leaveGame(); break;
    case 'leave': leaveGame(); break;
  }
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'mode') send({t: 'mode', mode: e.target.value}); });
document.addEventListener('input', e => { if (e.target.id === 'name') { ME.name = e.target.value.trim().slice(0, 14); store('mt_name', ME.name); } if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'code') joinGame(e.target.value); if (e.key === 'Escape') closeModal(); });

render();
</script>
</body>
</html>
