<title>Moth Synth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one anodised hardware panel. Top strip = brand, patch picker, scope. Module cards wrap in a grid. Keyboard bed sticks to the bottom so you can play while turning knobs. Single committed dark look. */
:root{
  --case:#161b19; --panel:#232c28; --panel-hi:#2c3732; --rule:#3e4c46;
  --silk:#ebe3cc; --muted:#98a69f; --knob:#121614; --amber:#efa73b; --amber-dim:#6e5426;
  --trace:#86e3cc; --ivory:#eee7d6; --ivory-shade:#cfc6b1; --ebony:#1a1f1d; --down:#efa73b;
  --display:"Michroma","Eurostile","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html{background:var(--case)}
body{background:var(--case);color:var(--silk);font-family:var(--body);font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 0;
  box-sizing:border-box;overflow-x:hidden;min-height:100%;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
.rig{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Top strip */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,320px);gap:16px;align-items:center;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.18em;margin:0;line-height:1}
.brand small{font-size:.72rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.patch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.patch label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.patch select{background:var(--knob);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%;flex:1 1 150px;font-family:var(--mono);font-size:.9rem}
.btn{background:var(--knob);border:1px solid var(--rule);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.82rem;letter-spacing:.06em;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:active{background:var(--panel-hi)}
.status{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);flex-basis:100%}
.led{width:9px;height:9px;border-radius:50%;background:var(--amber-dim);flex:none}
.led.on{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.scope{width:100%;height:76px;display:block;background:#0c100e;border:1px solid var(--rule);border-radius:6px}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.scope{height:64px}}

/* Modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.mod{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod h2{font-family:var(--display);font-weight:400;font-size:.66rem;letter-spacing:.24em;margin:0;display:flex;align-items:center;gap:10px;color:var(--silk)}
.mod h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.knobs{display:flex;flex-wrap:wrap;gap:6px 4px}
.knob{width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
.knob svg{width:46px;height:46px;display:block}
.knob .lab{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.knob .val{font-family:var(--mono);font-size:.68rem;color:var(--silk);white-space:nowrap;font-variant-numeric:tabular-nums}
.knob .trk{fill:none;stroke:var(--rule);stroke-width:4;stroke-linecap:round}
.knob .arc{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round}
.knob .cap{fill:var(--knob);stroke:#000;stroke-opacity:.5}
.knob .ptr{stroke:var(--silk);stroke-width:2.4;stroke-linecap:round}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;width:max-content;max-width:100%}
.seg button{background:var(--knob);border:0;border-right:1px solid var(--rule);padding:6px 9px;cursor:pointer;font-size:.76rem;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--amber);color:#1b1408}
.seg svg{width:24px;height:14px;display:block}
.seg path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:34px}

/* Keyboard bed */
.bed{position:sticky;bottom:0;z-index:5;background:var(--case);padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px));margin-top:2px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule)}
.bedbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.octave{font-family:var(--mono);font-size:.85rem;min-width:30px;text-align:center}
.hint{font-size:.78rem;color:var(--muted);margin-left:auto}
@media (max-width:600px){.hint,#midiBtn{display:none}.bedbar .btn{padding:6px 9px}}
.keys{position:relative;display:flex;height:150px;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:0 0 8px 8px;overflow:hidden;background:var(--ebony)}
@media (max-width:600px){.keys{height:122px}}
.key{position:relative}
.key.w{flex:1;background:linear-gradient(180deg,var(--ivory-shade) 0,var(--ivory) 14%);border-right:1px solid #8f8774;border-radius:0 0 6px 6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:7px;gap:2px}
.key.b{position:absolute;top:0;height:60%;background:linear-gradient(180deg,#2b322f,var(--ebony));border-radius:0 0 4px 4px;z-index:2;display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.key .kl{font-family:var(--mono);font-size:.62rem;color:#7a735f}
.key.b .kl{color:var(--muted)}
.key .nl{font-family:var(--mono);font-size:.62rem;color:#5a5446;font-weight:500}
.key.w.down,.key.w.lit{background:linear-gradient(180deg,#e7b468,var(--down))}
.key.b.down,.key.b.lit{background:linear-gradient(180deg,#b37a29,var(--down))}
.key.w.latch{box-shadow:inset 0 -6px 0 var(--amber)}
.key.b.latch{box-shadow:inset 0 -5px 0 var(--amber)}
@media (prefers-reduced-motion:no-preference){.key{transition:background .06s}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<div class="rig">
  <header class="top">
    <div class="brand"><h1>MOTH</h1><small>Poly-8 synthesizer</small></div>
    <div class="patch">
      <label for="preset">Patch</label>
      <button class="btn" id="prevPreset" aria-label="Previous patch">‹</button>
      <select id="preset"></select>
      <button class="btn" id="nextPreset" aria-label="Next patch">›</button>
      <button class="btn" id="randomize">Surprise me</button>
      <div class="status"><span class="led" id="led"></span><span id="statusText">Press a key to switch the sound on</span></div>
    </div>
    <canvas class="scope" id="scope" aria-label="Oscilloscope showing the output waveform"></canvas>
  </header>

  <main class="mods" id="mods"></main>

  <section class="bed" aria-label="Keyboard">
    <div class="bedbar">
      <button class="btn" id="octDown" aria-label="Octave down">− Oct</button>
      <span class="octave" id="octLabel">C3</span>
      <button class="btn" id="octUp" aria-label="Octave up">Oct +</button>
      <button class="btn" id="panic">All notes off</button>
      <button class="btn" id="midiBtn" hidden>Connect MIDI</button>
      <span class="hint">Computer keys: A–; play, W E T Y U O P sharps, Z / X change octave. Drag knobs up or down (Shift for fine), double-click to reset.</span>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</div>

<script>
(() => {
'use strict';
// ---------- Parameters ----------
const INIT = {
  'o1.wave':'sawtooth','o1.oct':0,'o1.level':0.8,
  'o2.wave':'square','o2.semi':0,'o2.fine':7,'o2.level':0.5,'noise':0,
  'f.type':'lowpass','f.cut':2400,'f.res':2,'f.env':2,
  'fe.a':0.005,'fe.d':0.35,'fe.s':0.2,'fe.r':0.4,
  'ae.a':0.005,'ae.d':0.3,'ae.s':0.7,'ae.r':0.35,
  'lfo.wave':'sine','lfo.rate':5,'lfo.pitch':0,'lfo.filt':0,
  'fx.drive':0.1,'fx.dtime':0.33,'fx.fb':0.35,'fx.dmix':0.2,'fx.rev':0.2,
  'v.mode':'poly','v.glide':0.08,'vol':0.7,
  'arp.mode':'off','arp.bpm':120,'arp.div':'1/16','arp.oct':1,'arp.hold':'off'
};
const PRESETS = {
  'Night Bus': {},
  'Moth Wings Pad': {'o2.wave':'sawtooth','o2.fine':12,'f.cut':900,'f.res':1,'f.env':1.5,'fe.a':1.2,'fe.d':2,'fe.s':0.5,'fe.r':2,'ae.a':0.9,'ae.d':1,'ae.s':0.85,'ae.r':2.5,'lfo.wave':'triangle','lfo.rate':0.3,'lfo.filt':0.6,'fx.rev':0.5,'fx.dmix':0.15,'fx.drive':0},
  'Rubber Bass': {'v.mode':'mono','v.glide':0.06,'o1.wave':'square','o1.oct':-1,'o2.wave':'sawtooth','o2.semi':-12,'o2.fine':5,'o2.level':0.6,'f.cut':300,'f.res':6,'f.env':3,'fe.a':0.002,'fe.d':0.25,'fe.s':0,'fe.r':0.15,'ae.a':0.002,'ae.d':0.4,'ae.s':0.6,'ae.r':0.12,'fx.drive':0.35,'fx.dmix':0,'fx.rev':0.05},
  'Acid Line': {'v.mode':'mono','v.glide':0.05,'o1.level':1,'o2.level':0,'f.cut':380,'f.res':16,'f.env':3.5,'fe.a':0.002,'fe.d':0.18,'fe.s':0,'fe.r':0.1,'ae.a':0.002,'ae.s':0.8,'ae.r':0.08,'fx.drive':0.5,'fx.dmix':0.25,'fx.dtime':0.375,'fx.rev':0.05},
  'Glass Pluck': {'o1.wave':'triangle','o2.wave':'sine','o2.semi':12,'o2.fine':0,'o2.level':0.6,'f.cut':1500,'f.res':4,'f.env':3,'fe.d':0.25,'fe.s':0,'ae.a':0.002,'ae.d':0.6,'ae.s':0,'ae.r':0.6,'fx.dmix':0.3,'fx.fb':0.45,'fx.rev':0.35,'fx.drive':0},
  'Brass Section': {'o2.wave':'sawtooth','o2.fine':9,'f.cut':700,'f.res':1.5,'f.env':2.2,'fe.a':0.08,'fe.d':0.4,'fe.s':0.6,'ae.a':0.06,'ae.s':0.9,'ae.r':0.25,'lfo.pitch':6,'lfo.rate':5.5,'fx.rev':0.3},
  'Wobble': {'v.mode':'mono','o1.oct':-1,'o2.fine':-8,'f.cut':200,'f.res':10,'f.env':0.5,'lfo.wave':'sine','lfo.rate':3,'lfo.filt':3,'fx.drive':0.6,'fx.dmix':0.1,'ae.s':1,'ae.r':0.1},
  'Sky Arp': {'o1.wave':'triangle','o2.wave':'square','o2.semi':12,'o2.fine':0,'o2.level':0.35,'f.cut':1800,'f.res':5,'f.env':2.5,'fe.d':0.2,'fe.s':0,'ae.a':0.002,'ae.d':0.35,'ae.s':0,'ae.r':0.3,'fx.dmix':0.35,'fx.fb':0.5,'fx.dtime':0.4,'fx.rev':0.4,'arp.mode':'updown','arp.bpm':112,'arp.div':'1/16','arp.oct':2,'arp.hold':'on'}
};
const STORE_KEY = 'moth-synth-patch';
let P = {...INIT, ...PRESETS['Night Bus']};
let presetName = 'Night Bus';
let baseOct = 3;
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && saved.P) { P = {...INIT, ...saved.P}; presetName = saved.name || ''; if (Number.isInteger(saved.oct)) baseOct = saved.oct; }
} catch (e) {}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify({P, name: presetName, oct: baseOct})); } catch (e) {} }, 300);
}

// ---------- Formatting ----------
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const F = {
  time: v => v <= 0.0005 ? 'off' : v < 1 ? Math.round(v * 1000) + ' ms' : v.toFixed(2) + ' s',
  hz: v => v >= 1000 ? (v / 1000).toFixed(1) + ' kHz' : v >= 10 ? Math.round(v) + ' Hz' : v.toFixed(2) + ' Hz',
  pct: v => Math.round(v * 100) + '%',
  oct: v => sgn(Math.round(v * 10) / 10) + ' oct',
  st: v => sgn(v) + ' st',
  ct: v => sgn(v) + ' ct',
  q: v => 'Q ' + v.toFixed(1),
  bpm: v => v + ' bpm',
  x: v => '×' + v,
};

// ---------- UI building ----------
const WAVES = {
  sine: 'M1 7 C4 -1.5 8 -1.5 12 7 S20 15.5 23 7',
  triangle: 'M1 7 L6.5 1 L17.5 13 L23 7',
  sawtooth: 'M1 13 L12 1 V13 L23 1 V13',
  square: 'M1 13 V1 H12 V13 H23 V1',
};
const waveOpts = Object.keys(WAVES).map(w => ({v: w, label: {sine:'Sine',triangle:'Triangle',sawtooth:'Saw',square:'Square'}[w], icon: WAVES[w]}));
const MODULES = [
  {title:'OSC 1', items:[
    {seg:'o1.wave', opts:waveOpts},
    {k:'o1.oct', label:'Octave', min:-2, max:2, step:1, bi:true, fmt:v => sgn(v)},
    {k:'o1.level', label:'Level', min:0, max:1, fmt:F.pct}]},
  {title:'OSC 2', items:[
    {seg:'o2.wave', opts:waveOpts},
    {k:'o2.semi', label:'Semi', min:-12, max:12, step:1, bi:true, fmt:F.st},
    {k:'o2.fine', label:'Fine', min:-50, max:50, step:1, bi:true, fmt:F.ct},
    {k:'o2.level', label:'Level', min:0, max:1, fmt:F.pct},
    {k:'noise', label:'Noise', min:0, max:1, fmt:F.pct}]},
  {title:'FILTER', items:[
    {seg:'f.type', opts:[{v:'lowpass',label:'Low-pass'},{v:'bandpass',label:'Band'},{v:'highpass',label:'High-pass'}]},
    {k:'f.cut', label:'Cutoff', min:30, max:16000, log:true, fmt:F.hz},
    {k:'f.res', label:'Reso', min:0.1, max:24, fmt:F.q},
    {k:'f.env', label:'Env amt', min:-4, max:4, bi:true, fmt:F.oct}]},
  {title:'FILTER ENVELOPE', items:[
    {k:'fe.a', label:'Attack', min:0.001, max:8, log:true, fmt:F.time},
    {k:'fe.d', label:'Decay', min:0.01, max:8, log:true, fmt:F.time},
    {k:'fe.s', label:'Sustain', min:0, max:1, fmt:F.pct},
    {k:'fe.r', label:'Release', min:0.01, max:10, log:true, fmt:F.time}]},
  {title:'AMP ENVELOPE', items:[
    {k:'ae.a', label:'Attack', min:0.001, max:8, log:true, fmt:F.time},
    {k:'ae.d', label:'Decay', min:0.01, max:8, log:true, fmt:F.time},
    {k:'ae.s', label:'Sustain', min:0, max:1, fmt:F.pct},
    {k:'ae.r', label:'Release', min:0.01, max:10, log:true, fmt:F.time}]},
  {title:'LFO', items:[
    {seg:'lfo.wave', opts:waveOpts},
    {k:'lfo.rate', label:'Rate', min:0.05, max:20, log:true, fmt:F.hz},
    {k:'lfo.pitch', label:'Vibrato', min:0, max:100, step:1, fmt:v => v + ' ct'},
    {k:'lfo.filt', label:'Wah', min:0, max:4, fmt:v => v.toFixed(1) + ' oct'}]},
  {title:'EFFECTS', items:[
    {k:'fx.drive', label:'Drive', min:0, max:1, fmt:F.pct},
    {k:'fx.dtime', label:'Delay', min:0.03, max:1.2, log:true, fmt:F.time},
    {k:'fx.fb', label:'Repeats', min:0, max:0.9, fmt:F.pct},
    {k:'fx.dmix', label:'Echo mix', min:0, max:1, fmt:F.pct},
    {k:'fx.rev', label:'Reverb', min:0, max:1, fmt:F.pct}]},
  {title:'VOICE', items:[
    {seg:'v.mode', tag:'Mode', opts:[{v:'poly',label:'Poly'},{v:'mono',label:'Mono'}]},
    {k:'v.glide', label:'Glide', min:0, max:1, fmt:F.time},
    {k:'vol', label:'Volume', min:0, max:1, fmt:F.pct}]},
  {title:'ARPEGGIATOR', items:[
    {seg:'arp.mode', tag:'Play', opts:[{v:'off',label:'Off'},{v:'up',label:'Up'},{v:'down',label:'Down'},{v:'updown',label:'Up-Dn'},{v:'random',label:'Rand'}]},
    {seg:'arp.div', tag:'Step', opts:['1/4','1/8','1/8T','1/16'].map(v => ({v, label:v}))},
    {seg:'arp.hold', tag:'Hold', opts:[{v:'off',label:'Off'},{v:'on',label:'Latch'}]},
    {k:'arp.bpm', label:'Tempo', min:50, max:220, step:1, fmt:F.bpm},
    {k:'arp.oct', label:'Range', min:1, max:3, step:1, fmt:v => v + ' oct'}]},
];

const knobs = {}, segs = {};
const A0 = -135, A1 = 135;
const pt = (a, r) => { const t = a * Math.PI / 180; return [28 + r * Math.sin(t), 28 - r * Math.cos(t)]; };
function arcPath(a0, a1, r) {
  if (Math.abs(a1 - a0) < 0.5) a1 = a0 + (a1 >= a0 ? 0.5 : -0.5);
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const toN = (d, v) => d.log ? Math.log(v / d.min) / Math.log(d.max / d.min) : (v - d.min) / (d.max - d.min);
function fromN(d, n) {
  n = Math.min(1, Math.max(0, n));
  let v = d.log ? d.min * Math.pow(d.max / d.min, n) : d.min + n * (d.max - d.min);
  if (d.step) v = Math.round(v / d.step) * d.step;
  else v = +v.toPrecision(4);
  return v;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function makeKnob(d) {
  const el = document.createElement('div');
  el.className = 'knob'; el.tabIndex = 0; el.setAttribute('role', 'slider'); el.setAttribute('aria-label', d.label);
  el.id = 'knob-' + d.k.replace('.', '-');
  el.innerHTML = `<svg viewBox="0 0 56 56" aria-hidden="true"><path class="trk" d="${arcPath(A0, A1, 22)}"/><path class="arc"/><circle class="cap" cx="28" cy="28" r="15"/><line class="ptr" x1="28" y1="28"/></svg><span class="lab">${d.label}</span><span class="val"></span>`;
  const arc = el.querySelector('.arc'), ptr = el.querySelector('.ptr'), val = el.querySelector('.val');
  d.render = () => {
    const v = P[d.k], n = toN(d, v), a = A0 + n * (A1 - A0);
    const from = d.bi ? 0 : A0;
    arc.setAttribute('d', arcPath(Math.min(from, a), Math.max(from, a), 22));
    const [x, y] = pt(a, 12); ptr.setAttribute('x2', x); ptr.setAttribute('y2', y);
    const txt = d.fmt(v); val.textContent = txt;
    el.setAttribute('aria-valuenow', v); el.setAttribute('aria-valuetext', txt);
    el.setAttribute('aria-valuemin', d.min); el.setAttribute('aria-valuemax', d.max);
  };
  let drag = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.focus();
    drag = {y: e.clientY, n: toN(d, P[d.k])};
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
