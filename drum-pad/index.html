<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Drum Touch Pad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen hardware unit — transport and pattern strips, loop lane, then a square work area (pads or steps) sized to the viewport. */
:root {
  --bg: #14161b;
  --panel: #1c1f26;
  --pad: #252931;
  --line: #333845;
  --ink: #e8eaf0;
  --dim: #8b91a1;
  --kick: #ff7a2f;
  --snare: #ff4f72;
  --metal: #3fd2d6;
  --tom: #f2c14e;
  --perc: #a88cff;
  --rec: #ff3b3b;
  --scrim: rgba(8, 9, 12, 0.72);
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  display: flex;
  justify-content: center;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.app { width: 100%; display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.name { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.sub { font-family: var(--mono); font-size: 0.72rem; color: var(--dim); }
.vol { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.72rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.vol input { width: 110px; accent-color: var(--metal); }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--metal); outline-offset: 2px; }
.tbtn {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 11px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 7px; min-height: 38px;
}
.tbtn:hover { border-color: var(--dim); }
.tbtn:disabled { opacity: 0.4; cursor: default; }
.tbtn .ico { font-size: 0.72rem; }
#play[aria-pressed="true"] { border-color: var(--metal); color: var(--metal); }
#rec .ico, #edRec .ico { color: var(--rec); }
#rec[aria-pressed="true"], #edRec[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: #fff; }
#rec[aria-pressed="true"] .ico, #edRec[aria-pressed="true"] .ico { color: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.bpm { display: inline-flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 38px; }
.bpm button { background: none; border: 0; width: 32px; align-self: stretch; font-size: 1.1rem; color: var(--dim); }
.bpm button:hover { color: var(--ink); }
.bpm input {
  width: 3.2ch; background: none; border: 0; color: var(--ink); text-align: right;
  font-family: var(--mono); font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.bpm input::-webkit-inner-spin-button, .bpm input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.bpm span { font-family: var(--mono); font-size: 0.62rem; color: var(--dim); padding-left: 5px; }
.spacer { flex: 1; }

.chip {
  background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; min-height: 28px;
  font-family: var(--mono); font-size: 0.7rem; color: var(--dim);
}
.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; min-height: 28px; font-family: var(--mono); font-size: 0.7rem; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.swing { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.7rem; color: var(--dim); }
.swing input { width: 84px; accent-color: var(--tom); }
.swing output { color: var(--ink); min-width: 3.5ch; font-variant-numeric: tabular-nums; }

.lane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 7px; display: flex; flex-direction: column; gap: 5px; }
#tl { width: 100%; height: 48px; display: block; }
.lanefoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.laneinfo { font-family: var(--mono); font-size: 0.68rem; color: var(--dim); min-width: 0; }
.laneinfo b { color: var(--ink); font-weight: 600; }
.laneinfo.recording b { color: var(--rec); }
.tabs { display: inline-flex; flex-shrink: 0; }

.main {
  width: 100%;
  container-type: inline-size;
}
/* Pads span the full width; height stays square on phones and shrinks to fit short screens, making the pads wider than tall */
.grid {
  width: 100%;
  height: min(100cqw, max(250px, calc(100vh - 360px)));
  height: min(100cqw, max(250px, calc(100dvh - 360px)));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; touch-action: none; }
.pad {
  --c: var(--metal);
  position: relative; overflow: hidden;
  border: 1px solid #0c0d10; border-radius: 10px;
  background: linear-gradient(160deg, #2c313b, var(--pad) 55%, #1f232a);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -3px 6px rgba(0,0,0,0.35), 0 2px 0 #0b0c0f;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  padding: 7px 8px; text-align: left; touch-action: none;
  transition: transform 60ms ease-out;
}
.pad::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--c); opacity: 0.55; }
.pad.down { transform: scale(0.965); }
.pad:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.pad .glow {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), var(--c), transparent 75%);
  mix-blend-mode: screen;
}
.pad .num { font-family: var(--mono); font-size: 0.62rem; color: var(--dim); position: relative; }
.pad .lbl { font-size: clamp(0.66rem, 2.6vw, 0.9rem); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.05; position: relative; }
.pad .tag { font-family: var(--mono); font-size: 0.56rem; color: var(--c); letter-spacing: 0.04em; position: relative; }
.pad .key {
  position: absolute; right: 7px; top: 6px; font-family: var(--mono); font-size: 0.62rem; color: var(--dim);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; text-transform: uppercase;
}
.g-kick { --c: var(--kick); } .g-snare { --c: var(--snare); } .g-metal { --c: var(--metal); }
.g-tom { --c: var(--tom); } .g-perc { --c: var(--perc); }

/* Step view */
.stepsView { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.mini button {
  --c: var(--metal); position: relative; min-height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--pad);
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 6px; text-align: left;
  border-top: 3px solid var(--c);
}
.mini button.has::after { content: ""; position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.mini button[aria-pressed="true"] { background: var(--c); color: var(--bg); }
.stephead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stephead .nm { font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.stephead .nm small { font-family: var(--mono); font-weight: 400; font-size: 0.66rem; color: var(--dim); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; touch-action: manipulation; }
.cell {
  --c: var(--metal); aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--pad);
  font-family: var(--mono); font-size: 0.56rem; color: var(--dim); display: flex; align-items: flex-end; justify-content: flex-start; padding: 3px 4px;
}
.cell.beat { border-color: var(--dim); }
.cell.on { background: color-mix(in srgb, var(--c) 55%, var(--pad)); color: var(--bg); border-color: var(--c); }
.cell.acc { background: var(--c); color: var(--bg); border-color: var(--c); }
.cell.now { box-shadow: 0 0 0 2px var(--ink) inset; }

.hint { margin: 0; text-align: center; font-family: var(--mono); font-size: 0.66rem; color: var(--dim); }

/* Pad editor */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h2 { margin: 0; font-size: 1.1rem; letter-spacing: 0.05em; text-transform: uppercase; }
.sheet h2 small { font-family: var(--mono); font-size: 0.68rem; color: var(--dim); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
.knob { display: grid; grid-template-columns: 4.5rem 1fr 4.5rem; align-items: center; gap: 10px; font-family: var(--mono); font-size: 0.74rem; color: var(--dim); }
.knob input { width: 100%; accent-color: var(--metal); }
.knob output { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.sample { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 9px; }
.sample .src { font-family: var(--mono); font-size: 0.74rem; color: var(--dim); }
.sample .src b { color: var(--ink); font-weight: 600; }
.msg { margin: 0; font-family: var(--mono); font-size: 0.7rem; color: var(--tom); min-height: 1em; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 0.74rem; padding: 8px 14px; border-radius: 8px; z-index: 30;
  max-width: calc(100% - 32px);
}

@media (hover: none) { .pad .key, .hint .keys { display: none; } }
@media (max-width: 420px) { .sub { display: none; } .vol input { width: 80px; } .tbtn { padding: 7px 9px; } .swing input { width: 70px; } }
@media (prefers-reduced-motion: reduce) {
  .pad { transition: none; }
  #rec[aria-pressed="true"] .ico, #edRec[aria-pressed="true"] .ico { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="name">Drum Touch Pad</span><span class="sub">16 pads · synth kit · 2-bar looper</span></div>
    <label class="vol" for="vol">Vol <input id="vol" type="range" min="0" max="100" value="80"></label>
  </header>

  <section class="row" aria-label="Transport">
    <button id="play" class="tbtn" aria-pressed="false"><span class="ico">▶</span><span class="t">Play</span></button>
    <button id="rec" class="tbtn" aria-pressed="false"><span class="ico">●</span>Rec</button>
    <div class="bpm">
      <button id="bpmDown" aria-label="Slower">−</button>
      <input id="bpm" type="number" min="40" max="220" value="92" aria-label="Tempo in BPM">
      <span>BPM</span>
      <button id="bpmUp" aria-label="Faster">+</button>
    </div>
    <span class="spacer"></span>
    <button id="undo" class="tbtn">Undo</button>
    <button id="clear" class="tbtn">Clear</button>
    <button id="export" class="tbtn">Export</button>
  </section>

  <section class="row" aria-label="Sound and timing">
    <div class="seg" id="kits" role="group" aria-label="Kit"></div>
    <label class="swing" for="swing">Swing <input id="swing" type="range" min="50" max="75" step="1" value="50"><output id="swingV">50%</output></label>
    <button id="tQuant" class="chip" aria-pressed="true">Quantize 1/16</button>
    <button id="tClick" class="chip" aria-pressed="true">Metronome</button>
    <button id="tDyn" class="chip" aria-pressed="true">Dynamics</button>
    <button id="tRepeat" class="chip" aria-pressed="false">Repeat off</button>
  </section>

  <div class="lane">
    <canvas id="tl" aria-label="Loop timeline, 2 bars of 4/4"></canvas>
    <div class="lanefoot">
      <div class="laneinfo" id="info"></div>
      <div class="seg tabs" role="group" aria-label="View">
        <button id="vPads" aria-pressed="true">Pads</button>
        <button id="vSteps" aria-pressed="false">Steps</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="grid" id="grid"></div>
    <div class="stepsView" id="stepsView" hidden>
      <div class="mini" id="mini" role="group" aria-label="Instrument"></div>
      <div class="stephead">
        <span class="nm" id="stepName"></span>
        <button id="editSel" class="tbtn">Edit sound</button>
      </div>
      <div class="steps" id="steps" role="group" aria-label="Steps"></div>
    </div>
  </div>

  <p class="hint" id="hint"><span class="keys">Keys 1–4 · Q–R · A–F · Z–V · Space plays/stops · Right-click a pad to edit · </span>Long-press a pad to edit its sound</p>
</div>

<div class="scrim" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edName">
    <div class="sheet-head">
      <h2 id="edName"></h2>
      <button id="edClose" class="tbtn">Done</button>
    </div>
    <label class="knob" for="edPitch">Pitch <input id="edPitch" type="range" min="-12" max="12" step="1"><output id="edPitchV"></output></label>
    <label class="knob" for="edDecay">Decay <input id="edDecay" type="range" min="25" max="200" step="5"><output id="edDecayV"></output></label>
    <label class="knob" for="edLevel">Level <input id="edLevel" type="range" min="0" max="150" step="5"><output id="edLevelV"></output></label>
    <div class="sample">
      <div class="src" id="edSrc"></div>
      <div class="row">
        <button id="edRec" class="tbtn" aria-pressed="false"><span class="ico">●</span><span class="t">Record voice</span></button>
        <button id="edLoad" class="tbtn">Load audio file</button>
        <button id="edDrop" class="tbtn">Use synth sound</button>
        <input id="edFile" type="file" accept="audio/*" hidden>
      </div>
      <p class="msg" id="edMsg"></p>
    </div>
    <div class="row">
      <button id="edPlay" class="tbtn"><span class="ico">▶</span>Preview</button>
      <button id="edReset" class="tbtn">Reset knobs</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- Kit ----------
  const PADS = [
    { id: "crash",  name: "Crash",      key: "1", g: "metal" },
    { id: "ride",   name: "Ride",       key: "2", g: "metal" },
    { id: "ohat",   name: "Open Hat",   key: "3", g: "metal" },
    { id: "bell",   name: "Cowbell",    key: "4", g: "perc"  },
    { id: "htom",   name: "High Tom",   key: "q", g: "tom"   },
    { id: "mtom",   name: "Mid Tom",    key: "w", g: "tom"   },
    { id: "ltom",   name: "Low Tom",    key: "e", g: "tom"   },
    { id: "shaker", name: "Shaker",     key: "r", g: "perc"  },
    { id: "clap",   name: "Clap",       key: "a", g: "snare" },
    { id: "rim",    name: "Rimshot",    key: "s", g: "snare" },
    { id: "chat",   name: "Closed Hat", key: "d", g: "metal" },
    { id: "clave",  name: "Clave",      key: "f", g: "perc"  },
    { id: "kick",   name: "Kick",       key: "z", g: "kick"  },
    { id: "snare",  name: "Snare",      key: "x", g: "snare" },
    { id: "sub",    name: "808 Sub",    key: "c", g: "kick"  },
    { id: "snap",   name: "Snap",       key: "v", g: "snare" },
  ];
  const PAD_INDEX = Object.fromEntries(PADS.map((p, i) => [p.id, i]));
  const KEYMAP = Object.fromEntries(PADS.map(p => [p.key, p.id]));
  const padNum = i => String((3 - Math.floor(i / 4)) * 4 + (i % 4) + 1).padStart(2, "0"); // MPC numbering: A01 bottom-left
  const LOOP_BEATS = 8; // 2 bars of 4/4
  const PATS = ["A", "B", "C", "D"];
  const KITS = {
    "808":    { name: "808",      lp: 18000, crush: 0,  dec: 1,    tune: {} },
    acoustic: { name: "Acoustic", lp: 13000, crush: 0,  dec: 1.25, tune: { kick: 0.8, snare: 1.12, htom: 0.88, mtom: 0.88, ltom: 0.88, chat: 0.9, ohat: 0.9 } },
    lofi:     { name: "Lo-fi",    lp: 3400,  crush: 14, dec: 0.8,  tune: { all: 0.92 } },
  };
  const REPEATS = [0, 2, 4, 8]; // hits per beat: off, 1/8, 1/16, 1/32

  // ---------- State ----------
  function examplePatterns() {
    const a = [];
    [0, 0.75, 2.5, 4, 4.75, 6.25, 6.5].forEach(b => a.push({ id: "kick", v: 1, b }));
    [1, 3, 5, 7].forEach(b => a.push({ id: "snare", v: 0.95, b }));
    for (let b = 0; b < 8; b += 0.5) if (b !== 7.5) a.push({ id: "chat", v: b % 1 ? 0.55 : 0.85, b });
    a.push({ id: "ohat", v: 0.8, b: 7.5 }, { id: "sub", v: 0.8, b: 0 }, { id: "sub", v: 0.7, b: 4 }, { id: "rim", v: 0.6, b: 3.75 });
    const b = a.filter(e => e.b < 6 || (e.id === "kick" && e.b === 6.25));
    b.push({ id: "crash", v: 0.9, b: 0 });
    [["htom", 6], ["htom", 6.25], ["mtom", 6.5], ["mtom", 6.75], ["ltom", 7], ["ltom", 7.25], ["snare", 7.5], ["snare", 7.75]]
      .forEach(([id, t], i) => b.push({ id, v: 0.7 + i * 0.04, b: t }));
    return { A: a, B: b, C: [], D: [] };
  }

  const STORE_KEY = "drum-touch-pad-v2";
  const state = {
    bpm: 92, vol: 80, quant: true, click: true, dyn: true, swing: 54, repeat: 0, kit: "808",
    patterns: examplePatterns(), cur: "A", chain: "A", songOn: false, example: true,
    pads: {}, // id -> {pitch, decay, level}
  };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && saved.patterns) Object.assign(state, saved);
    else {
      const old = JSON.parse(localStorage.getItem("drum-touch-pad-v1") || "null");
      if (old && Array.isArray(old.events)) {
        ["bpm", "vol", "quant", "click", "dyn"].forEach(k => { if (k in old) state[k] = old[k]; });
        if (!old.example) { state.patterns.A = old.events; state.example = false; }
      }
    }
  } catch (e) { /* storage unavailable: keep defaults */ }
  PATS.forEach(p => { if (!Array.isArray(state.patterns[p])) state.patterns[p] = []; });
  state.cur = "A"; state.songOn = false; // one loop: pattern buttons were removed
  if (!KITS[state.kit]) state.kit = "808";
  state.sel = state.sel && PAD_INDEX[state.sel] != null ? state.sel : "kick";

  function save() {
    try {
      const patterns = {};
      PATS.forEach(p => patterns[p] = state.patterns[p].map(({ id, v, b }) => ({ id, v, b })));
      const { bpm, vol, quant, click, dyn, swing, repeat, kit, cur, chain, songOn, example, pads, sel } = state;
      localStorage.setItem(STORE_KEY, JSON.stringify({ bpm, vol, quant, click, dyn, swing, repeat, kit, cur, chain, songOn, example, pads, sel, patterns }));
    } catch (e) { /* ignore */ }
  }
  const pat = () => state.patterns[state.cur];
  const padSet = id => state.pads[id] || { pitch: 0, decay: 100, level: 100 };
  const history = []; // {p, ev} for undo

  // ---------- Audio engine ----------
  let ctx = null, graph = null, bus = null, openHat = null;
  const samples = {}; // id -> {buf, name}
  const NOISE = (() => {
    const sr = 44100, b = new AudioBuffer({ length: sr * 2, numberOfChannels: 1, sampleRate: sr });
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  })();
  const volume = () => Math.pow(state.vol / 100, 1.6) * 1.1;

  function crushCurve(levels) {
    const c = new Float32Array(2048);

      let v = 1;
      if (state.dyn) v = 1 - Math.min(1, Math.hypot(px - 0.5, py - 0.5) / 0.6) * 0.6;

  const cv = document.getElementById("tl"), g2 = cv.getContext("2d");

    .forEach(n => colors[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());

    state.example = false;
    if (!here.length) {
      const ev = { id, v: 0.8, b: s / 4 };
      list.push(ev); history.push({ p: state.cur, ev });
      if (!running) { initAudio(); trigger(id, ctx.currentTime, 0.8); }
    } else if (Math.max(...here.map(e => e.v)) < 0.97) here.forEach(e => e.v = 1);
    else state.patterns[state.cur] = list.filter(e => !here.includes(e));
    save(); refreshLoop();
  }
  function renderSteps() {
    const list = pat(), id = state.sel, p = PADS[PAD_INDEX[id]];
    miniEls.forEach((b, i) => {
      b.setAttribute("aria-pressed", PADS[i].id === id);
      b.classList.toggle("has", list.some(e => e.id === PADS[i].id));
    });
    document.getElementById("stepName").innerHTML = `${p.name}<small>A${padNum(PAD_INDEX[id])} · tap a step: on → accent → off</small>`;
    cellEls.forEach((c, s) => {
      const here = list.filter(e => e.id === id && inStep(e, s));
      c.className = "cell g-" + p.g + (s % 4 === 0 ? " beat" : "") + (here.length ? (Math.max(...here.map(e => e.v)) >= 0.97 ? " acc" : " on") : "") + (s === lastStep ? " now" : "");
      c.setAttribute("aria-label", `Step ${s + 1}${here.length ? ", on" : ", off"}`);
    });
  }

  // ---------- Pad editor ----------
  const sheet = document.getElementById("sheet");
  const ed = id => document.getElementById(id);
  let editId = null, mediaRec = null;

  function openEditor(id) {
    editId = id;
    [...held.keys()].forEach(endHold);
    renderEditor();
    ed("edMsg").textContent = "";
    sheet.hidden = false;
    ed("edClose").focus();
  }
  function closeEditor() {
    if (mediaRec && mediaRec.state === "recording") mediaRec.stop();
    sheet.hidden = true;
    editId = null;
  }
  function renderEditor() {
    const p = PADS[PAD_INDEX[editId]], s = padSet(editId), smp = samples[editId];
    ed("edName").innerHTML = `${p.name}<small>pad A${padNum(PAD_INDEX[editId])}</small>`;
    ed("edPitch").value = s.pitch; ed("edPitchV").textContent = (s.pitch > 0 ? "+" : "") + s.pitch + " st";
    ed("edDecay").value = s.decay; ed("edDecayV").textContent = s.decay + "%";
    ed("edLevel").value = s.level; ed("edLevelV").textContent = s.level + "%";
    ed("edSrc").innerHTML = smp
      ? `Sound: <b>your sample</b> · ${smp.name} · ${smp.buf.duration.toFixed(2)} s`
      : `Sound: <b>built-in ${KITS[state.kit].name} synth</b>`;
    ed("edDrop").disabled = !smp;
    const recOn = !!mediaRec;
    ed("edRec").setAttribute("aria-pressed", recOn);
    ed("edRec").querySelector(".t").textContent = recOn ? "Stop" : "Record voice";
  }
  function setKnob(key, val) {
    state.pads[editId] = { ...padSet(editId), [key]: Number(val) };
    save(); renderEditor(); renderPads();
  }
  [["edPitch", "pitch"], ["edDecay", "decay"], ["edLevel", "level"]].forEach(([elId, key]) => {
    ed(elId).addEventListener("input", e => setKnob(key, e.target.value));
    ed(elId).addEventListener("change", () => preview());
  });
  function preview() { if (!editId) return; initAudio(); trigger(editId, ctx.currentTime, 0.95); flash(PAD_INDEX[editId], 0.95); }
  ed("edPlay").addEventListener("click", preview);
  ed("edReset").addEventListener("click", () => { delete state.pads[editId]; save(); renderEditor(); renderPads(); preview(); });
  ed("edClose").addEventListener("click", closeEditor);
  sheet.addEventListener("pointerdown", e => { if (e.target === sheet) closeEditor(); });
  ed("editSel").addEventListener("click", () => openEditor(state.sel));

  // Samples: decode, trim silence, keep in IndexedDB
  const decoder = new OfflineAudioContext(1, 1, 44100);
  function trimBuffer(buf) {
    const d = buf.getChannelData(0), sr = buf.sampleRate;
    let peak = 0; for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    const th = Math.max(0.01, peak * 0.06);
    let a = 0; while (a < d.length && Math.abs(d[a]) < th) a++;
    let z = d.length - 1; while (z > a && Math.abs(d[z]) < th * 0.4) z--;
    a = Math.max(0, a - Math.floor(sr * 0.004));
    z = Math.min(d.length, z + Math.floor(sr * 0.06), a + sr * 6);
    if (z <= a) return null;
    const gain = peak > 0 ? Math.min(4, 0.9 / peak) : 1; // normalise
    const out = new AudioBuffer({ length: z - a, numberOfChannels: buf.numberOfChannels, sampleRate: sr });
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const src = buf.getChannelData(ch).subarray(a, z), dst = new Float32Array(src.length);
      for (let i = 0; i < src.length; i++) dst[i] = src[i] * gain;
      const fade = Math.min(dst.length, Math.floor(sr * 0.02));
      for (let i = 0; i < fade; i++) dst[dst.length - 1 - i] *= i / fade;
      out.copyToChannel(dst, ch);
    }
    return out;
  }
  async function decodeSample(bytes) {
    const buf = await decoder.decodeAudioData(bytes.slice(0));
    return trimBuffer(buf);
  }
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("drum-touch-pad", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("samples");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const run = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const tx = db.transaction("samples", mode);
        fn(tx.objectStore("samples"));
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    };
    return {
      put: (k, v) => run("readwrite", s => s.put(v, k)),
      del: k => run("readwrite", s => s.delete(k)),
      all: async () => {
        const db = await open();
        return new Promise((res, rej) => {
          const out = {}, r = db.transaction("samples").objectStore("samples").openCursor();
          r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
          r.onerror = () => rej(r.error);
        });
      },
    };
  })();
  async function setSample(id, bytes, name) {
    const msg = ed("edMsg");
    try {
      const buf = await decodeSample(bytes);
      if (!buf) { msg.textContent = "That recording was silent. Try again a little closer to the microphone."; return; }
      samples[id] = { buf, name };
      msg.textContent = "";
      try { await idb.put(id, { bytes, name }); } catch (e) { msg.textContent = "Sample loaded. It can't be saved in this browser, so it will be gone after a reload."; }
      renderPads(); if (editId === id) { renderEditor(); preview(); }
    } catch (e) {
      msg.textContent = "Couldn't read that audio. Try a WAV, MP3 or M4A file.";
    }
  }
  ed("edLoad").addEventListener("click", () => ed("edFile").click());
  ed("edFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !editId) return;
    if (f.size > 20 * 1024 * 1024) { ed("edMsg").textContent = "That file is over 20 MB. Use a shorter clip."; return; }
    await setSample(editId, await f.arrayBuffer(), f.name.replace(/\.[^.]+$/, "").slice(0, 28));
  });
  ed("edDrop").addEventListener("click", async () => {
    delete samples[editId];
    try { await idb.del(editId); } catch (e) { /* ignore */ }
    renderPads(); renderEditor(); preview();
  });
  ed("edRec").addEventListener("click", async () => {
    const msg = ed("edMsg");
    if (mediaRec) { if (mediaRec.state === "recording") mediaRec.stop(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      msg.textContent = "The microphone isn't available here. Record a clip with your phone's voice recorder, then use Load audio file.";
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    } catch (e) {
      msg.textContent = "Microphone access was blocked. Allow it in your browser, or record a clip elsewhere and use Load audio file.";
      return;
    }
    const id = editId, chunks = [], mr = new MediaRecorder(stream);
    let auto = null;
    mediaRec = mr;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearTimeout(auto);
      stream.getTracks().forEach(t => t.stop());
      mediaRec = null;
      if (editId) renderEditor();
      msg.textContent = "";
      if (chunks.length) await setSample(id, await new Blob(chunks, { type: mr.mimeType }).arrayBuffer(), "Voice recording");
    };
    mr.start();
    auto = setTimeout(() => { if (mr.state === "recording") mr.stop(); }, 4000);
    msg.textContent = "Recording… make your sound, then tap Stop (stops itself after 4 s).";
    renderEditor();
  });

  // ---------- Export ----------
  async function renderAudio() {
    const chain = chainList();
    const plan = state.songOn && chain.length ? chain : [state.cur, state.cur, state.cur, state.cur];
    const L = loopLen(), sr = 44100, lead = 0.02;
    const oc = new OfflineAudioContext(2, Math.ceil((plan.length * L + 2) * sr), sr);
    const saved = { ctx, bus, openHat };
    ctx = oc; bus = buildGraph(oc).bus; openHat = null;
    try {
      plan.forEach((p, k) => state.patterns[p].forEach(ev => trigger(ev.id, lead + k * L + evTime(ev.b), ev.v)));
    } finally { ctx = saved.ctx; bus = saved.bus; openHat = saved.openHat; }
    return { buf: await oc.startRendering(), plan };
  }
  function encodeWav(buf) {
    const ch = buf.numberOfChannels, len = buf.length, dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
    const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); dv.setUint32(4, 36 + len * ch * 2, true); str(8, "WAVE"); str(12, "fmt ");
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
    dv.setUint32(24, buf.sampleRate, true); dv.setUint32(28, buf.sampleRate * ch * 2, true);
    dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, len * ch * 2, true);
    const data = Array.from({ length: ch }, (_, c) => buf.getChannelData(c));
    let peak = 0;
    for (const d of data) for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    const norm = peak > 0.89 ? 0.89 / peak : 1; // offline output is unclipped float: scale it into range
    let o = 44;
    for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
      const s = Math.max(-1, Math.min(1, data[c][i] * norm));
      dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
    }
    return new Uint8Array(dv.buffer);
  }
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  function zipOne(name, data) { // a single stored (uncompressed) entry
    const nm = new TextEncoder().encode(name), crc = crc32(data), size = data.length;
    const local = new DataView(new ArrayBuffer(30)), central = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(12, 33, true);
    local.setUint32(14, crc, true); local.setUint32(18, size, true); local.setUint32(22, size, true); local.setUint16(26, nm.length, true);
    central.setUint32(0, 0x02014b50, true); central.setUint16(4, 20, true); central.setUint16(6, 20, true); central.setUint16(14, 33, true);
    central.setUint32(16, crc, true); central.setUint32(20, size, true); central.setUint32(24, size, true); central.setUint16(28, nm.length, true);
    const cdOffset = 30 + nm.length + size;
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true);
    end.setUint32(12, 46 + nm.length, true); end.setUint32(16, cdOffset, true);
    return new Blob([local, nm, data, central, nm, end], { type: "application/zip" });
  }
  async function exportAudio() {
    const btn = document.getElementById("export");
    btn.disabled = true; btn.textContent = "Rendering…";
    try {
      const { buf, plan } = await renderAudio();
      const wav = encodeWav(buf);
      const base = `drum-touch-pad-${state.bpm}bpm`;
      const desc = `${plan.length * 2} bars`;
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) {
        try { await dl.save({ filename: base + ".zip", data: zipOne(base + ".wav", wav) }); toast(`Saved ${desc} as ${base}.zip (WAV inside)`); }
        catch (e) { toast(e && e.code === "declined" ? "Export cancelled" : "Saving files isn't available in this view"); }
      } else {
        const url = URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
        const a = document.createElement("a");
        a.href = url; a.download = base + ".wav";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        toast(`Downloaded ${desc} as ${base}.wav`);
      }
    } catch (e) {
      toast("Export failed: this browser couldn't render the audio");
    } finally {
      btn.disabled = false; btn.textContent = "Export";
    }
  }

  let toastTimer = null;
  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3500);
  }

  // ---------- UI wiring ----------
  const playBtn = document.getElementById("play"), recBtn = document.getElementById("rec");
  const bpmInput = document.getElementById("bpm"), info = document.getElementById("info");
  const undoBtn = document.getElementById("undo"), clearBtn = document.getElementById("clear");
  const toggles = { tQuant: "quant", tClick: "click", tDyn: "dyn" };
  const kitWrap = document.getElementById("kits");
  const kitEls = Object.entries(KITS).map(([k, v]) => {
    const b = document.createElement("button");
    b.textContent = v.name;
    b.addEventListener("click", () => { state.kit = k; if (graph) applyKit(graph); save(); refresh(); if (!running) { initAudio(); trigger("kick", ctx.currentTime, 0.9); trigger("chat", ctx.currentTime + 0.18, 0.7); trigger("snare", ctx.currentTime + 0.36, 0.9); } });
    kitWrap.appendChild(b);
    return [k, b];
  });

  function updateInfo() {
    const n = pat().length;
    info.classList.toggle("recording", recording);
    if (recording) info.innerHTML = `<b>Recording</b> · play the pads · ${n} hits`;
    else if (state.example) info.innerHTML = `<b>Example beat</b> · press Play`;
    else if (n === 0) info.innerHTML = `<b>Loop is empty</b> · press Rec or use Steps`;
    else info.innerHTML = `<b>${n} hits</b> · ${state.bpm} BPM`;
    undoBtn.disabled = history.length === 0;
    clearBtn.disabled = n === 0;
  }
  function refreshLoop() {
    updateInfo();
    if (!stepsView.hidden) renderSteps();
    drawTimeline();
  }
  function refresh() {
    playBtn.setAttribute("aria-pressed", running);
    playBtn.querySelector(".ico").textContent = running ? "■" : "▶";
    playBtn.querySelector(".t").textContent = running ? "Stop" : "Play";
    recBtn.setAttribute("aria-pressed", recording);
    for (const [elId, key] of Object.entries(toggles)) document.getElementById(elId).setAttribute("aria-pressed", !!state[key]);
    const r = document.getElementById("tRepeat");
    r.setAttribute("aria-pressed", state.repeat > 0);
    r.textContent = state.repeat ? `Repeat 1/${state.repeat * 4}` : "Repeat off";
    kitEls.forEach(([k, b]) => b.setAttribute("aria-pressed", k === state.kit));
    document.getElementById("swing").value = state.swing;
    document.getElementById("swingV").textContent = state.swing + "%";
    renderPads();
    refreshLoop();
  }

  playBtn.addEventListener("click", togglePlay);
  recBtn.addEventListener("click", () => {
    if (!running) start();
    recording = !recording;
    refresh();
  });
  undoBtn.addEventListener("click", () => {
    const h = history.pop();
    if (h) state.patterns[h.p] = state.patterns[h.p].filter(e => e !== h.ev);
    save(); refreshLoop();
  });
  clearBtn.addEventListener("click", () => {
    state.patterns[state.cur] = []; state.example = false;
    for (let i = history.length - 1; i >= 0; i--) if (history[i].p === state.cur) history.splice(i, 1);
    save(); refreshLoop();
  });
  document.getElementById("export").addEventListener("click", exportAudio);
  document.getElementById("bpmDown").addEventListener("click", () => setBpm(state.bpm - 1));
  document.getElementById("bpmUp").addEventListener("click", () => setBpm(state.bpm + 1));
  bpmInput.addEventListener("change", () => setBpm(bpmInput.value));
  bpmInput.addEventListener("keydown", e => { if (e.key === "Enter") bpmInput.blur(); });
  for (const [elId, key] of Object.entries(toggles)) {
    document.getElementById(elId).addEventListener("click", () => {
      state[key] = !state[key];
      save(); refresh();
    });
  }
  document.getElementById("tRepeat").addEventListener("click", () => {
    state.repeat = REPEATS[(REPEATS.indexOf(state.repeat) + 1) % REPEATS.length];
    save(); refresh();
  });
  const swingInput = document.getElementById("swing");
  swingInput.addEventListener("input", () => {
    state.swing = Number(swingInput.value);
    document.getElementById("swingV").textContent = state.swing + "%";
    save(); drawTimeline();
  });
  const volInput = document.getElementById("vol");
  volInput.value = state.vol;
  volInput.addEventListener("input", () => {
    state.vol = Number(volInput.value);
    if (graph) graph.master.gain.setTargetAtTime(volume(), ctx.currentTime, 0.02);
    save();
  });
  const vPads = document.getElementById("vPads"), vSteps = document.getElementById("vSteps");
  function setView(steps) {
    vPads.setAttribute("aria-pressed", !steps); vSteps.setAttribute("aria-pressed", steps);
    grid.hidden = steps; stepsView.hidden = !steps;
    document.getElementById("hint").hidden = steps;
    if (steps) renderSteps();
    try { localStorage.setItem("drum-touch-pad-view", steps ? "steps" : "pads"); } catch (e) { /* ignore */ }
  }
  vPads.addEventListener("click", () => setView(false));
  vSteps.addEventListener("click", () => setView(true));

  // Stop the loop when the page is hidden (phone locked, tab switched)
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });

  bpmInput.value = state.bpm;
  window.addEventListener("resize", drawTimeline);
  let view = "pads";
  try { view = localStorage.getItem("drum-touch-pad-view") || "pads"; } catch (e) { /* ignore */ }
  setView(view === "steps");
  refresh();

  // Restore saved samples
  (async () => {
    try {
      const all = await idb.all();
      for (const [id, v] of Object.entries(all)) {
        if (PAD_INDEX[id] == null) continue;
        try { const buf = await decodeSample(v.bytes); if (buf) samples[id] = { buf, name: v.name }; } catch (e) { /* skip unreadable */ }
      }
      renderPads();
    } catch (e) { /* IndexedDB unavailable */ }
  })();
})();
</script>
</body>
</html>
